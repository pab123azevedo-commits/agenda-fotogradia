<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Financeiro — FotoHub</title>
<link rel="icon" type="image/png" href="/icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e0f;
  --surface: #161618;
  --surface2: #1e1e21;
  --border: rgba(255,255,255,0.07);
  --text: #f0ede8;
  --muted: #7a7870;
  --accent: #8a8f98;
  --danger: #ff5555;
  --futebol: #4a9eff;
  --carros: #ff6b35;
  --motos: #f0b429;
  --ensaio: #4ecb8d;
  --outro: #a78bfa;
  --green: #4ecb8d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: hidden; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

header {
  display: flex; align-items: center; gap: 12px;
  padding: 1.1rem 1.5rem; border-bottom: 1px solid var(--border);
}
header img { width: 34px; height: 34px; border-radius: 8px; }
.header-title { font-family: 'Bebas Neue'; font-size: 1.05rem; letter-spacing: 0.04em; line-height: 1.05; }
.header-title span { color: var(--accent); }
.back-link {
  margin-left: auto; display: flex; align-items: center; gap: 6px;
  color: var(--muted); text-decoration: none; font-size: 0.82rem; transition: color 0.2s;
}
.back-link:hover { color: var(--text); }

.wrap { max-width: 1180px; margin: 0 auto; padding: 2rem 2.5rem 3rem; }

.periodo-tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 1.4rem; }
.periodo-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
  border-radius: 20px; padding: 0.4rem 1.1rem; font-family: 'DM Sans'; font-size: 0.8rem;
  cursor: pointer; transition: all 0.15s;
}
.periodo-btn:hover { border-color: var(--accent); color: var(--text); }
.periodo-btn.active { background: var(--futebol); border-color: var(--futebol); color: #fff; }

.mes-nav {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  margin-bottom: 1.8rem; gap: 1rem;
}
.mes-nav-center { display: flex; align-items: center; gap: 1.4rem; justify-self: center; }
.btn-exportar-icone {
  justify-self: end; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: border-color 0.15s;
}
.btn-exportar-icone:hover { border-color: var(--accent); }
.mes-nav button {
  background: var(--surface2); border: 0.5px solid var(--border); color: var(--text);
  width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.2rem;
  display: flex; align-items: center; justify-content: center;
}
.mes-nav button:hover { border-color: var(--accent); }
.mes-nav-label { font-family: 'Bebas Neue'; font-size: 1.6rem; letter-spacing: 0.05em; min-width: 220px; text-align: center; }

.cards-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 1.8rem; }
.card {
  background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.02) 100%);
  border: 0.5px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 1.5rem 1.7rem;
}
.card-label { font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-bottom: 0.7rem; }
.card-val { font-family: 'Bebas Neue'; font-size: 2.4rem; letter-spacing: 0.02em; line-height: 1; }
.card-val.green { color: var(--green); }
.card-val.accent { color: var(--accent); }
.card-val.expense { color: var(--danger); }

.panels-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1.2rem; align-items: stretch; }

.panel {
  background: var(--surface); border: 0.5px solid var(--border); border-radius: 18px;
  padding: 1.8rem; margin-bottom: 1.2rem;
}
.panel-title { font-size: 0.92rem; font-weight: 500; margin-bottom: 1.4rem; color: var(--text); }
.panel-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; }
.panel-title-row .panel-title { margin-bottom: 0; }

.btn-add-despesa {
  background: linear-gradient(135deg, #4a9eff 0%, #2f7fe0 100%); color: #fff; border: none;
  border-radius: 10px; padding: 0.55rem 1rem; font-family: 'DM Sans'; font-size: 0.82rem;
  font-weight: 500; cursor: pointer;
}
.btn-add-despesa:hover { opacity: 0.9; }

.despesa-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.8rem 0; border-bottom: 1px solid var(--border);
}
.despesa-item:last-child { border-bottom: none; }
.despesa-info { display: flex; flex-direction: column; gap: 2px; }
.despesa-desc { font-size: 0.88rem; font-weight: 500; }
.despesa-meta { font-size: 0.72rem; color: var(--muted); }
.despesa-direita { display: flex; align-items: center; gap: 12px; }
.despesa-valor { font-family: 'Bebas Neue'; font-size: 1.1rem; color: var(--danger); }
.btn-del-despesa { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; }
.btn-del-despesa:hover { color: var(--danger); }
.despesa-vazio { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 1.5rem 0; }

.modal-despesa {
  background: linear-gradient(160deg, #1c1c1f 0%, #111113 100%);
  border: 0.5px solid rgba(255,255,255,0.1); border-radius: 18px;
  padding: 1.75rem 1.5rem; width: 100%; max-width: 400px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.6); margin: auto;
}
.modal-despesa-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.3rem; font-size: 1.05rem; font-weight: 500; }
.btn-salvar-despesa {
  background: var(--green); color: #0e0e0f; border: none; border-radius: 10px;
  padding: 0.75rem; width: 100%; font-family: 'DM Sans'; font-size: 0.88rem; font-weight: 600;
  cursor: pointer; margin-top: 0.4rem;
}

.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
  align-items: center; justify-content: center; padding: 1rem;
}
.modal-overlay.open { display: flex; }
.modal-close { background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; }
.modal-close:hover { color: var(--text); }
.field { margin-bottom: 0.9rem; }
.field label { display: block; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
.field input, .field select {
  width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: 0.6rem 0.75rem; color: var(--text); font-family: 'DM Sans'; font-size: 0.88rem; outline: none;
}
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Gráfico de barras por dia */
.chart-empty { color: var(--muted); font-size: 0.9rem; text-align: center; padding: 3rem 0; }

.chart-tooltip {
  position: fixed; display: none; pointer-events: none; z-index: 50;
  background: #24242a; border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px; padding: 0.5rem 0.75rem;
  font-family: 'DM Sans'; font-size: 0.78rem; color: var(--text);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  white-space: nowrap;
}
.chart-tooltip .tt-dia { color: var(--muted); font-size: 0.68rem; margin-bottom: 2px; }
.chart-tooltip .tt-valor { font-family: 'Bebas Neue'; font-size: 1.05rem; letter-spacing: 0.02em; color: var(--futebol); }
.chart-bar { cursor: pointer; transition: opacity 0.15s; }
.chart-bar:hover { opacity: 0.75; }

/* Donut por tipo */
.donut-row { display: flex; align-items: center; gap: 2rem; flex-wrap: wrap; justify-content: center; height: 100%; }
.donut-svg { width: 170px; height: 170px; flex-shrink: 0; }
.legend { display: flex; flex-direction: column; gap: 12px; }
.legend-item { display: flex; align-items: center; gap: 10px; font-size: 0.88rem; }
.legend-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
.legend-val { color: var(--muted); margin-left: auto; padding-left: 18px; }

/* Tabela */
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th { text-align: left; padding: 0.8rem 0.6rem; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
td { padding: 0.9rem 0.6rem; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
.tabela-vazia { text-align: center; color: var(--muted); padding: 2rem 0; }
.tipo-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.status-pill { font-size: 0.68rem; padding: 3px 10px; border-radius: 20px; letter-spacing: 0.04em; }
.status-pill.pendente   { background: rgba(255,255,255,0.08); color: var(--muted); }
.status-pill.confirmado { background: rgba(74,158,255,0.15); color: var(--futebol); }
.status-pill.entregue   { background: rgba(78,203,141,0.15); color: var(--green); }
.status-pill.adiado     { background: rgba(167,139,250,0.15); color: var(--outro); }

#loading { display: flex; align-items: center; justify-content: center; height: 60vh; color: var(--muted); font-size: 0.85rem; flex-direction: column; gap: 10px; }
#loading img { width: 56px; height: 56px; animation: loading-pulse 1.4s ease-in-out infinite; }
@keyframes loading-pulse {
  0%, 100% { opacity: 0.5; transform: scale(0.94); }
  50% { opacity: 1; transform: scale(1); }
}

@media (max-width: 900px) {
  .panels-grid { grid-template-columns: 1fr; }
}

@media (max-width: 640px) {
  .wrap { padding: 1rem; }
  .mes-nav { grid-template-columns: 1fr; justify-items: center; gap: 0.7rem; }
  .mes-nav > div:first-child { display: none; }
  .mes-nav-label { font-size: 1.15rem; min-width: 150px; }
  .mes-nav button { width: 32px; height: 32px; font-size: 1.05rem; }
  .btn-exportar-icone { justify-self: center; }
  .cards-row { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .card { padding: 1.1rem 1.3rem; }
  .card-label { font-size: 0.62rem; margin-bottom: 0.5rem; }
  .card-val { font-size: 1.7rem; }
  .panel { padding: 1.3rem; }
  .panel-title { font-size: 0.8rem; margin-bottom: 1rem; }
  .donut-row { gap: 1.5rem; }
  .donut-svg { width: 120px; height: 120px; }
  .legend-item { font-size: 0.78rem; gap: 8px; }
  .legend-dot { width: 9px; height: 9px; }
  .legend-val { padding-left: 12px; }
  table { font-size: 0.72rem; }
  th:nth-child(4), td:nth-child(4) { display: none; } /* esconde coluna tipo no mobile */
}
/* ── BARRA DE NAVEGAÇÃO INFERIOR (só mobile) ── */
.bottom-nav { display: none; }
.bn-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--muted); text-decoration: none; background: none; border: none;
  font-family: 'DM Sans'; font-size: 0.66rem; cursor: pointer; flex: 1; padding: 0.4rem 0;
}
.bn-item.active { color: var(--futebol); }

.mais-overlay {
  display: none; position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.6); align-items: flex-end; justify-content: center;
}
.mais-overlay.open { display: flex; }
.mais-sheet {
  background: var(--surface); width: 100%; max-width: 480px;
  border-radius: 20px 20px 0 0; padding: 0.6rem 1rem 1.6rem;
  border-top: 0.5px solid var(--border);
}
.mais-handle { width: 40px; height: 4px; background: var(--border); border-radius: 10px; margin: 0.4rem auto 1rem; }
.mais-item {
  display: block; width: 100%; text-align: left; background: none; border: none;
  color: var(--text); font-family: 'DM Sans'; font-size: 0.92rem; padding: 0.85rem 0.4rem;
  border-bottom: 1px solid var(--border); text-decoration: none; cursor: pointer;
}
.mais-item:last-child { border-bottom: none; }
.mais-item.sair { color: var(--danger); margin-top: 0.4rem; }

@media (max-width: 640px) {
  body { padding-bottom: 70px; }
  .bottom-nav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 400;
    background: rgba(10,10,11,0.97); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid rgba(255,255,255,0.08);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
}
</style>

<body>

<div id="loading"><img src="/logo-transparente.png" alt="Carregando" /><span>Carregando…</span></div>

<div id="page" style="display:none;">
  <header>
    <img src="/logo-transparente.png" alt="Logo" />
    <div class="header-title">Financeiro<br><span>FotoHub</span></div>
    <a class="back-link" href="index.html">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Voltar
    </a>
  </header>

  <div class="wrap">

    <div class="periodo-tabs">
      <button class="periodo-btn" data-periodo="semana" onclick="trocarPeriodo('semana')">Semana</button>
      <button class="periodo-btn active" data-periodo="mes" onclick="trocarPeriodo('mes')">Mês</button>
      <button class="periodo-btn" data-periodo="trimestre" onclick="trocarPeriodo('trimestre')">Trimestre</button>
      <button class="periodo-btn" data-periodo="ano" onclick="trocarPeriodo('ano')">Ano</button>
    </div>

    <div class="mes-nav">
      <div></div>
      <div class="mes-nav-center">
        <button onclick="mudarPeriodo(-1)">‹</button>
        <div class="mes-nav-label" id="mes-nav-label">—</div>
        <button onclick="mudarPeriodo(1)">›</button>
      </div>
      <button class="btn-exportar-icone" onclick="exportarPDF()" title="Exportar relatório em PDF">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 6 2 18 2 18 9"/>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
          <rect x="6" y="14" width="12" height="8"/>
        </svg>
      </button>
    </div>

    <div class="cards-row">
      <div class="card"><div class="card-label">Recebido</div><div class="card-val green" id="c-recebido">R$ 0</div></div>
      <div class="card"><div class="card-label">A receber</div><div class="card-val accent" id="c-areceber">R$ 0</div></div>
      <div class="card"><div class="card-label">Despesas</div><div class="card-val expense" id="c-despesas">R$ 0</div></div>
      <div class="card"><div class="card-label">Lucro líquido</div><div class="card-val" id="c-lucro">R$ 0</div></div>
      <div class="card"><div class="card-label">Total do mês</div><div class="card-val" id="c-total">R$ 0</div></div>
      <div class="card"><div class="card-label">Eventos no mês</div><div class="card-val" id="c-count">0</div></div>
    </div>

    <div class="panels-grid">
      <div class="panel">
        <div class="panel-title">Faturamento por dia</div>
        <div id="chart-container" style="position:relative;"></div>
      </div>
      <div class="chart-tooltip" id="chart-tooltip"></div>

      <div class="panel">
        <div class="panel-title">Faturamento por tipo de evento</div>
        <div id="donut-container"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Eventos do mês</div>
      <div id="tabela-container"></div>
    </div>

    <div class="panel">
      <div class="panel-title-row">
        <div class="panel-title">Despesas do mês</div>
        <button class="btn-add-despesa" onclick="abrirModalDespesa()">+ Adicionar despesa</button>
      </div>
      <div id="despesas-container"></div>
    </div>

  </div>
</div>

<!-- Modal de nova despesa -->
<div class="modal-overlay" id="modal-despesa-overlay">
  <div class="modal-despesa">
    <div class="modal-despesa-header">
      <span>Nova despesa</span>
      <button class="modal-close" onclick="fecharModalDespesa()">✕</button>
    </div>
    <div class="field"><label>Descrição</label><input type="text" id="desp-descricao" placeholder="Ex: Aluguel de lente, gasolina..." /></div>
    <div class="row2">
      <div class="field"><label>Valor (R$)</label><input type="text" id="desp-valor" placeholder="0,00" /></div>
      <div class="field"><label>Data</label><input type="date" id="desp-data" /></div>
    </div>
    <div class="field">
      <label>Categoria</label>
      <select id="desp-categoria">
        <option value="equipamento">Equipamento</option>
        <option value="transporte">Transporte</option>
        <option value="edicao">Edição/pós-produção</option>
        <option value="marketing">Marketing</option>
        <option value="outro">Outro</option>
      </select>
    </div>
    <button class="btn-salvar-despesa" onclick="salvarDespesa()">Salvar despesa</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc }
  from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAGuDCbOQfVpkj-jPJzglCgPNZE5P8lxRc",
  authDomain: "agenda-pabloframess-72769.firebaseapp.com",
  projectId: "agenda-pabloframess-72769",
  storageBucket: "agenda-pabloframess-72769.firebasestorage.app",
  messagingSenderId: "512997093150",
  appId: "1:512997093150:web:ddd833425994c90129a30f"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const TIPO_LABEL = { futebol: 'Futebol', carros: 'Carros', motos: 'Motos', ensaio: 'Ensaio', outro: 'Outro', banlek: 'Banlek' };
const TIPO_COR   = { futebol: '#4a9eff', carros: '#ff6b35', motos: '#f0b429', ensaio: '#4ecb8d', outro: '#a78bfa', banlek: '#22d3ee' };

let eventos = [];
let despesas = [];
let despesasCol = null;
let dataRef = new Date();       // qualquer dia dentro do período que está sendo exibido
let periodoAtual = 'mes';       // 'semana' | 'mes' | 'trimestre' | 'ano'

function getIntervaloPeriodo() {
  const d = new Date(dataRef);
  if (periodoAtual === 'semana') {
    const diaSemana = d.getDay();
    const inicio = new Date(d.getFullYear(), d.getMonth(), d.getDate() - diaSemana);
    const fim = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + 6);
    return { inicio, fim };
  }
  if (periodoAtual === 'trimestre') {
    const q = Math.floor(d.getMonth() / 3);
    const inicio = new Date(d.getFullYear(), q*3, 1);
    const fim = new Date(d.getFullYear(), q*3 + 3, 0);
    return { inicio, fim };
  }
  if (periodoAtual === 'ano') {
    return { inicio: new Date(d.getFullYear(), 0, 1), fim: new Date(d.getFullYear(), 11, 31) };
  }
  // mes (padrão)
  return { inicio: new Date(d.getFullYear(), d.getMonth(), 1), fim: new Date(d.getFullYear(), d.getMonth()+1, 0) };
}

function labelPeriodo() {
  const { inicio, fim } = getIntervaloPeriodo();
  if (periodoAtual === 'semana') {
    const mesIgual = inicio.getMonth() === fim.getMonth();
    return mesIgual
      ? `${inicio.getDate()}–${fim.getDate()} ${MESES[fim.getMonth()].slice(0,3)} ${fim.getFullYear()}`
      : `${inicio.getDate()} ${MESES[inicio.getMonth()].slice(0,3)} – ${fim.getDate()} ${MESES[fim.getMonth()].slice(0,3)} ${fim.getFullYear()}`;
  }
  if (periodoAtual === 'trimestre') return `${Math.floor(inicio.getMonth()/3)+1}º Trimestre ${inicio.getFullYear()}`;
  if (periodoAtual === 'ano') return `${inicio.getFullYear()}`;
  return `${MESES[inicio.getMonth()]} ${inicio.getFullYear()}`;
}

window.mudarPeriodo = function(dir) {
  if (periodoAtual === 'semana') dataRef.setDate(dataRef.getDate() + dir*7);
  else if (periodoAtual === 'mes') dataRef.setMonth(dataRef.getMonth() + dir);
  else if (periodoAtual === 'trimestre') dataRef.setMonth(dataRef.getMonth() + dir*3);
  else dataRef.setFullYear(dataRef.getFullYear() + dir);
  render();
};

window.trocarPeriodo = function(tipo) {
  periodoAtual = tipo;
  document.querySelectorAll('.periodo-btn').forEach(b => b.classList.toggle('active', b.dataset.periodo === tipo));
  render();
};

function fmtMoeda(v) {
  return 'R$ ' + Number(v||0).toLocaleString('pt-BR', { minimumFractionDigits: 0 });
}

// Exporta todos os eventos do ano atualmente exibido como CSV, pronto pra abrir no Excel/Sheets
// Carrega uma imagem externa e devolve como base64 (necessário pra colocar no PDF).
// Se falhar (ex: CORS bloqueado), devolve null e o PDF sai sem logo — nunca quebra a exportação.
function carregarImagemBase64(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        canvas.getContext('2d').drawImage(img, 0, 0);
        resolve(canvas.toDataURL('image/png'));
      } catch (e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

window.exportarPDF = async function() {
  const anoRef = dataRef.getFullYear();
  const doAno = eventos.filter(e => (e.data||'').startsWith(String(anoRef)));
  if (!doAno.length) { alert(`Nenhum evento encontrado em ${anoRef}.`); return; }

  const TIPO_NOME = { futebol: 'Futebol', carros: 'Carros', motos: 'Motos', ensaio: 'Ensaio', outro: 'Outro', banlek: 'Banlek' };
  const { jsPDF } = window.jspdf;
  const docPdf = new jsPDF();
  const larguraPagina = docPdf.internal.pageSize.getWidth();

  const logoBase64 = await carregarImagemBase64('/icon-192.png');

  let y = 18;
  if (logoBase64) {
    docPdf.addImage(logoBase64, 'PNG', 15, 10, 16, 16);
  }
  docPdf.setFont('helvetica', 'bold');
  docPdf.setFontSize(16);
  docPdf.text('Relatório Financeiro', logoBase64 ? 36 : 15, 18);
  docPdf.setFont('helvetica', 'normal');
  docPdf.setFontSize(10);
  docPdf.setTextColor(120);
  docPdf.text(`FotoHub · Ano de ${anoRef}`, logoBase64 ? 36 : 15, 24);
  docPdf.setTextColor(0);
  y = 34;

  let totalGeralRecebido = 0, totalGeralAReceber = 0;

  for (let mes = 0; mes < 12; mes++) {
    const prefixo = `${anoRef}-${String(mes+1).padStart(2,'0')}`;
    const doMes = doAno.filter(e => (e.data||'').startsWith(prefixo)).sort((a,b) => (a.data||'').localeCompare(b.data||''));
    if (!doMes.length) continue;

    if (y > 260) { docPdf.addPage(); y = 18; }

    docPdf.setFont('helvetica', 'bold');
    docPdf.setFontSize(12);
    docPdf.text(MESES[mes], 15, y);
    y += 2;

    const linhas = doMes.map(e => [
      e.data ? e.data.split('-').reverse().join('/') : '—',
      e.clienteNome || e.nome || '—',
      TIPO_NOME[e.tipo] || e.tipo || '—',
      e.status || '—',
      fmtMoeda(e.valor)
    ]);

    const recebidoMes = doMes.filter(e => e.status === 'entregue').reduce((s,e) => s+Number(e.valor||0), 0);
    const aReceberMes = doMes.filter(e => e.status !== 'entregue' && e.status !== 'adiado').reduce((s,e) => s+Number(e.valor||0), 0);
    totalGeralRecebido += recebidoMes;
    totalGeralAReceber += aReceberMes;

    docPdf.autoTable({
      startY: y,
      head: [['Data', 'Cliente / Evento', 'Tipo', 'Status', 'Valor']],
      body: linhas,
      theme: 'striped',
      headStyles: { fillColor: [30, 30, 33], textColor: 255, fontSize: 9 },
      styles: { fontSize: 9, cellPadding: 2.5 },
      margin: { left: 15, right: 15 },
      foot: [['', '', '', 'Subtotal do mês', `${fmtMoeda(recebidoMes+aReceberMes)}`]],
      footStyles: { fillColor: [245,245,245], textColor: 0, fontStyle: 'bold', fontSize: 9 }
    });

    y = docPdf.lastAutoTable.finalY + 12;
  }

  if (y > 250) { docPdf.addPage(); y = 20; }
  docPdf.setDrawColor(200);
  docPdf.line(15, y, larguraPagina - 15, y);
  y += 8;
  docPdf.setFont('helvetica', 'bold');
  docPdf.setFontSize(11);
  docPdf.text(`Total recebido no ano: ${fmtMoeda(totalGeralRecebido)}`, 15, y);
  y += 7;
  docPdf.text(`Total a receber no ano: ${fmtMoeda(totalGeralAReceber)}`, 15, y);

  docPdf.save(`relatorio-financeiro-${anoRef}.pdf`);
};

window.exportarCSV = function() {
  const anoRef = dataRef.getFullYear();
  const doAno = eventos.filter(e => (e.data||'').startsWith(String(anoRef)));
  if (!doAno.length) { alert(`Nenhum evento encontrado em ${anoRef}.`); return; }

  const TIPO_NOME = { futebol: 'Futebol', carros: 'Carros', motos: 'Motos', ensaio: 'Ensaio', outro: 'Outro', banlek: 'Banlek' };
  const cabecalho = ['Data', 'Nome do evento', 'Cliente', 'Tipo', 'Status', 'Valor (R$)', 'Telefone', 'E-mail', 'Local'];

  function escaparCSV(v) {
    const s = String(v ?? '');
    return /["\n;]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }

  const linhas = doAno
    .slice()
    .sort((a,b) => (a.data||'').localeCompare(b.data||''))
    .map(e => [
      e.data ? e.data.split('-').reverse().join('/') : '',
      e.nome || '',
      e.clienteNome || '',
      TIPO_NOME[e.tipo] || e.tipo || '',
      e.status || '',
      Number(e.valor||0).toFixed(2).replace('.',','),
      e.telefone || '',
      e.email || '',
      e.local || ''
    ].map(escaparCSV).join(';'));

  // BOM no início garante que o Excel abra acentos (ç, ã, é...) corretamente
  const csv = '\uFEFF' + cabecalho.join(';') + '\n' + linhas.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `eventos-${anoRef}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

function render() {
  document.getElementById('mes-nav-label').textContent = labelPeriodo();

  const { inicio, fim } = getIntervaloPeriodo();
  const dentroDoPeriodo = (dataStr) => {
    if (!dataStr) return false;
    const d = new Date(dataStr + 'T00:00:00');
    return d >= inicio && d <= fim;
  };

  const doMes = eventos.filter(e => dentroDoPeriodo(e.data));
  const despesasDoMes = despesas.filter(d => dentroDoPeriodo(d.data));

  const recebido = doMes.filter(e => e.status === 'entregue').reduce((s,e) => s+Number(e.valor||0), 0);
  const areceber = doMes.filter(e => e.status !== 'entregue' && e.status !== 'adiado').reduce((s,e) => s+Number(e.valor||0), 0);
  const totalDespesas = despesasDoMes.reduce((s,d) => s+Number(d.valor||0), 0);
  const lucro = recebido - totalDespesas;

  document.getElementById('c-recebido').textContent = fmtMoeda(recebido);
  document.getElementById('c-areceber').textContent = fmtMoeda(areceber);
  document.getElementById('c-despesas').textContent = fmtMoeda(totalDespesas);
  document.getElementById('c-lucro').textContent    = fmtMoeda(lucro);
  document.getElementById('c-total').textContent    = fmtMoeda(recebido + areceber);
  document.getElementById('c-count').textContent    = doMes.length;

  if (periodoAtual === 'trimestre' || periodoAtual === 'ano') {
    renderChartMensal(doMes, inicio, fim);
  } else {
    renderChart(doMes, inicio, fim);
  }
  renderDonut(doMes);
  renderTabela(doMes);
  renderDespesas(despesasDoMes);
}

function niceMax(valor) {
  if (valor <= 0) return 10;
  const exp = Math.floor(Math.log10(valor));
  const base = Math.pow(10, exp);
  const norm = valor / base;
  let niceNorm;
  if (norm <= 1) niceNorm = 1;
  else if (norm <= 2) niceNorm = 2;
  else if (norm <= 5) niceNorm = 5;
  else niceNorm = 10;
  return niceNorm * base;
}

function renderChart(doMes, inicio, fim) {
  const totalDias = Math.round((fim - inicio) / 86400000) + 1;
  const porDia = Array(totalDias).fill(0);
  let houveValor = false;
  doMes.forEach(e => {
    if (e.status === 'adiado' || !e.data) return;
    const d = new Date(e.data + 'T00:00:00');
    const idx = Math.round((d - inicio) / 86400000);
    if (idx >= 0 && idx < totalDias) {
      porDia[idx] += Number(e.valor||0);
      houveValor = true;
    }
  });

  const container = document.getElementById('chart-container');
  if (!houveValor) {
    container.innerHTML = '<div class="chart-empty">Nenhum valor lançado neste período ainda.</div>';
    return;
  }

  const maxValor  = Math.max(...porDia);
  const eixoMax   = niceMax(maxValor);
  const nDivisoes = 4;

  const W = 900, H = 280;
  const padL = 62, padR = 16, padT = 16, padB = 34;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const larguraDia = chartW / totalDias;
  const larguraBarra = Math.min(larguraDia * 0.55, 34);

  let gridSvg = '';
  for (let i = 0; i <= nDivisoes; i++) {
    const valor = (eixoMax / nDivisoes) * i;
    const y = padT + chartH - (chartH * i / nDivisoes);
    gridSvg += `
      <line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(255,255,255,0.08)" stroke-dasharray="3 4" />
      <text x="${padL-10}" y="${y+4}" text-anchor="end" font-size="12" fill="rgba(255,255,255,0.4)" font-family="DM Sans">${fmtMoeda(valor)}</text>`;
  }

  // Rótulo do eixo X: número do dia se o período for só um mês, "DD/MM" se atravessar meses (semana)
  const atravessaMes = inicio.getMonth() !== fim.getMonth();
  let barrasSvg = '';
  for (let i = 0; i < totalDias; i++) {
    const diaDate = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + i);
    const v = porDia[i];
    const xCentro = padL + larguraDia * (i + 0.5);
    if (v > 0) {
      const alturaBarra = Math.max((v / eixoMax) * chartH, 3);
      const yTopo = padT + chartH - alturaBarra;
      barrasSvg += `<rect class="chart-bar" x="${xCentro - larguraBarra/2}" y="${yTopo}" width="${larguraBarra}" height="${alturaBarra}" rx="3" fill="var(--futebol)" data-dia="${diaDate.getDate()}/${diaDate.getMonth()+1}" data-valor="${v}"></rect>`;
    }
    const mostraRotulo = totalDias <= 15 || i % 2 === 0 || i === totalDias-1;
    if (mostraRotulo) {
      const rotulo = atravessaMes ? `${diaDate.getDate()}/${diaDate.getMonth()+1}` : `${diaDate.getDate()}`;
      barrasSvg += `<text x="${xCentro}" y="${H-10}" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)" font-family="DM Sans">${rotulo}</text>`;
    }
  }

  container.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block; overflow:visible;">${gridSvg}${barrasSvg}</svg>`;
}

// Gráfico por mês (usado em Trimestre/Ano) — mesma barra, só que cada coluna é um mês inteiro
function renderChartMensal(doPeriodo, inicio, fim) {
  const mesesNoPeriodo = [];
  let cursor = new Date(inicio.getFullYear(), inicio.getMonth(), 1);
  while (cursor <= fim) {
    mesesNoPeriodo.push(new Date(cursor));
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
  }

  const porMes = mesesNoPeriodo.map(() => 0);
  let houveValor = false;
  doPeriodo.forEach(e => {
    if (e.status === 'adiado' || !e.data) return;
    const d = new Date(e.data + 'T00:00:00');
    const idx = mesesNoPeriodo.findIndex(m => m.getFullYear() === d.getFullYear() && m.getMonth() === d.getMonth());
    if (idx >= 0) { porMes[idx] += Number(e.valor||0); houveValor = true; }
  });

  const container = document.getElementById('chart-container');
  if (!houveValor) {
    container.innerHTML = '<div class="chart-empty">Nenhum valor lançado neste período ainda.</div>';
    return;
  }

  const eixoMax = niceMax(Math.max(...porMes));
  const nDivisoes = 4;
  const W = 900, H = 280;
  const padL = 62, padR = 16, padT = 16, padB = 34;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const larguraCol = chartW / mesesNoPeriodo.length;
  const larguraBarra = Math.min(larguraCol * 0.5, 60);

  let gridSvg = '';
  for (let i = 0; i <= nDivisoes; i++) {
    const valor = (eixoMax / nDivisoes) * i;
    const y = padT + chartH - (chartH * i / nDivisoes);
    gridSvg += `
      <line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(255,255,255,0.08)" stroke-dasharray="3 4" />
      <text x="${padL-10}" y="${y+4}" text-anchor="end" font-size="12" fill="rgba(255,255,255,0.4)" font-family="DM Sans">${fmtMoeda(valor)}</text>`;
  }

  let barrasSvg = '';
  mesesNoPeriodo.forEach((m, i) => {
    const v = porMes[i];
    const xCentro = padL + larguraCol * (i + 0.5);
    if (v > 0) {
      const alturaBarra = Math.max((v / eixoMax) * chartH, 3);
      const yTopo = padT + chartH - alturaBarra;
      barrasSvg += `<rect class="chart-bar" x="${xCentro - larguraBarra/2}" y="${yTopo}" width="${larguraBarra}" height="${alturaBarra}" rx="3" fill="var(--futebol)" data-dia="${MESES[m.getMonth()].slice(0,3)}" data-valor="${v}"></rect>`;
    }
    barrasSvg += `<text x="${xCentro}" y="${H-10}" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)" font-family="DM Sans">${MESES[m.getMonth()].slice(0,3)}</text>`;
  });

  container.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block; overflow:visible;">${gridSvg}${barrasSvg}</svg>`;
}

function renderDonut(doMes) {
  const porTipo = {};
  let totalGeral = 0;
  doMes.filter(e => e.status !== 'adiado').forEach(e => {
    const t = e.tipo || 'outro';
    porTipo[t] = (porTipo[t] || 0) + Number(e.valor||0);
    totalGeral += Number(e.valor||0);
  });

  const container = document.getElementById('donut-container');
  const tipos = Object.keys(porTipo).filter(t => porTipo[t] > 0);
  if (tipos.length === 0) {
    container.innerHTML = '<div class="chart-empty">Nenhum valor lançado neste mês ainda.</div>';
    return;
  }

  const r = 52, circ = 2 * Math.PI * r;
  let offset = 0;
  let circles = '';
  tipos.forEach(t => {
    const frac = porTipo[t] / totalGeral;
    const len = frac * circ;
    circles += `<circle cx="65" cy="65" r="${r}" fill="none" stroke="${TIPO_COR[t]||'#888'}" stroke-width="16"
      stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 65 65)" />`;
    offset += len;
  });

  const legend = tipos
    .sort((a,b) => porTipo[b]-porTipo[a])
    .map(t => `<div class="legend-item">
        <span class="legend-dot" style="background:${TIPO_COR[t]||'#888'}"></span>
        ${TIPO_LABEL[t]||t}
        <span class="legend-val">${fmtMoeda(porTipo[t])}</span>
      </div>`).join('');

  container.innerHTML = `
    <div class="donut-row">
      <svg class="donut-svg" viewBox="0 0 130 130">${circles}</svg>
      <div class="legend">${legend}</div>
    </div>`;
}

function renderTabela(doMes) {
  const container = document.getElementById('tabela-container');
  if (doMes.length === 0) {
    container.innerHTML = '<div class="tabela-vazia">Nenhum evento neste mês.</div>';
    return;
  }
  const ordenado = doMes.slice().sort((a,b) => (a.data||'').localeCompare(b.data||''));
  let rows = ordenado.map(e => `
    <tr>
      <td>${e.data ? e.data.split('-').reverse().join('/') : '—'}${e.hora ? ' · '+e.hora : ''}</td>
      <td>${e.nome || '—'}</td>
      <td><span class="status-pill ${e.status||'pendente'}">${e.status||'pendente'}</span></td>
      <td><span class="tipo-dot" style="background:${TIPO_COR[e.tipo]||'#888'}"></span>${TIPO_LABEL[e.tipo]||e.tipo||'Outro'}</td>
      <td style="text-align:right;font-weight:500;">${fmtMoeda(e.valor)}</td>
    </tr>`).join('');

  container.innerHTML = `
    <table>
      <thead><tr><th>Data</th><th>Nome</th><th>Status</th><th>Tipo</th><th style="text-align:right;">Valor</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = 'index.html';
    return;
  }
  const eventosCol = collection(db, 'usuarios', user.uid, 'eventos');
  despesasCol = collection(db, 'usuarios', user.uid, 'despesas');

  let carregouEventos = false, carregouDespesas = false;
  function tentarMostrar() {
    if (carregouEventos && carregouDespesas) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('page').style.display = 'block';
      render();
    } else if (document.getElementById('page').style.display === 'block') {
      render();
    }
  }

  onSnapshot(eventosCol, (snapshot) => {
    eventos = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    carregouEventos = true;
    tentarMostrar();
  });

  onSnapshot(despesasCol, (snapshot) => {
    despesas = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    carregouDespesas = true;
    tentarMostrar();
  });
});

window.fazerLogout = async function() {

  window.location.href = 'index.html';
};
