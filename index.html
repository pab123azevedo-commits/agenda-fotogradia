<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda — Fotógrafos</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/th7jUdY.png" />
<link rel="apple-touch-icon" href="https://i.imgur.com/th7jUdY.png" />
<meta name="apple-mobile-web-app-title" content="Agenda Fotógrafos" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e0f;
  --surface: #161618;
  --surface2: #1e1e21;
  --border: rgba(255,255,255,0.07);
  --text: #f0ede8;
  --muted: #7a7870;
  --accent: #8a8f98;
  --danger: #ff5555;
  --futebol: #4a9eff;
  --carros: #ff6b35;
  --motos: #f0b429;
  --ensaio: #4ecb8d;
  --outro: #a78bfa;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; min-height: 100vh; overflow-x: hidden; }

/* Scrollbar global — invisível mas funcional */
::-webkit-scrollbar { width: 0px; background: transparent; }
::-webkit-scrollbar-thumb { background: transparent; }
* { scrollbar-width: none; -ms-overflow-style: none; }

/* ── LOADING ── */
#loading {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 999; font-family: 'Bebas Neue'; font-size: 1.5rem;
  letter-spacing: 0.1em; color: var(--muted);
}

/* ── LOGIN ── */
#login-screen {
  min-height: 100vh; display: flex; align-items: center;
  justify-content: center; position: relative; overflow: hidden;
}
#login-screen::before {
  content: 'AF'; position: absolute;
  font-family: 'Bebas Neue'; font-size: 40vw;
  color: rgba(255,255,255,0.02); pointer-events: none;
}
.login-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 2.5rem 2rem; width: 100%;
  max-width: 360px; position: relative; z-index: 1;
}
.login-field { margin-bottom: 1rem; }
.login-field label { display: block; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
.login-field input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-family: 'DM Sans'; font-size: 0.9rem; font-weight: 300;
  padding: 0.7rem 0.9rem; border-radius: 6px; outline: none; transition: border-color 0.15s;
}
.login-field input:focus { border-color: var(--accent); }
.login-field input::placeholder { color: rgba(255,255,255,0.18); }
.login-sub { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 1.75rem; }
.login-btn {
  width: 100%; background: var(--accent); color: var(--bg); border: none;
  font-family: 'Bebas Neue'; font-size: 1.1rem; letter-spacing: 0.1em;
  padding: 0.85rem; border-radius: 6px; cursor: pointer; margin-top: 0.5rem; transition: opacity 0.15s;
}
.login-btn:hover { opacity: 0.85; }
.login-btn:disabled { opacity: 0.4; cursor: default; }
#login-error { color: var(--danger); font-size: 0.8rem; margin-top: 0.75rem; min-height: 1.2em; text-align: center; }

/* ── APP ── */
#app { display: none; flex-direction: column; min-height: 100vh; }

/* ── HEADER ── */
header {
  padding: 1rem 1.75rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
}
.header-left { display: flex; align-items: center; gap: 0.875rem; }
.header-left img { height: 100px; flex-shrink: 0; }
.header-title { font-family: 'Bebas Neue'; font-size: clamp(1.4rem, 3vw, 2rem); letter-spacing: 0.05em; line-height: 1.1; }
.header-title span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; justify-content: flex-end; }
.header-date { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; text-align: right; line-height: 1.7; }
.logout-btn {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  font-family: 'DM Sans'; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 0.3rem 0.75rem; border-radius: 4px; cursor: pointer; transition: all 0.15s;
}
.logout-btn:hover { border-color: var(--danger); color: var(--danger); }

/* ── SINO NOTIFICAÇÕES ── */
.bell-wrap { position: relative; }
.bell-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--accent); width: 36px; height: 36px; border-radius: 8px;
  cursor: pointer; font-size: 1rem; display: flex; align-items: center;
  justify-content: center; transition: all 0.15s; position: relative;
}
.bell-btn:hover { border-color: var(--accent); background: rgba(138,143,152,0.12); }
.bell-count {
  position: absolute; top: -5px; right: -5px;
  background: var(--accent); color: var(--bg); font-size: 0.6rem; font-weight: 500;
  width: 16px; height: 16px; border-radius: 50%;
  display: none; align-items: center; justify-content: center;
  font-family: 'DM Sans';
}
.bell-count.show { display: flex; }

.bell-dropdown {
  display: none; position: absolute; top: calc(100% + 10px); right: 0;
  width: 320px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  z-index: 300; overflow: hidden;
  animation: dropDown 0.15s ease both;
}
.bell-dropdown.open { display: block; }
@keyframes dropDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }

.bell-dropdown-header {
  padding: 0.85rem 1rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface2);
}
.bell-dropdown-title { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.bell-dropdown-link {
  font-size: 0.68rem; color: var(--accent); text-decoration: none;
  letter-spacing: 0.06em; text-transform: uppercase; transition: opacity 0.15s;
}
.bell-dropdown-link:hover { opacity: 0.75; }

.bell-dropdown-list { max-height: 340px; overflow-y: auto; }

.bell-item {
  padding: 0.85rem 1rem; border-bottom: 1px solid var(--border);
  transition: background 0.12s;
}
.bell-item:last-child { border-bottom: none; }
.bell-item:hover { background: var(--surface2); }
.bell-item-nome { font-size: 0.85rem; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.bell-item-evento { font-size: 0.78rem; color: var(--accent); margin-bottom: 4px; }
.bell-item-meta { font-size: 0.72rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.bell-item-actions { display: flex; gap: 6px; }
.bell-aceitar {
  background: rgba(138,143,152,0.12); color: var(--text); border: 1px solid var(--border);
  font-family: 'Bebas Neue'; font-size: 0.8rem; letter-spacing: 0.08em;
  padding: 0.25rem 0.75rem; border-radius: 4px; cursor: pointer; transition: all 0.15s;
}
.bell-aceitar:hover { background: rgba(138,143,152,0.25); border-color: var(--accent); color: var(--accent); }
.bell-recusar {
  background: transparent; color: var(--muted); border: 1px solid var(--border);
  font-family: 'Bebas Neue'; font-size: 0.8rem; letter-spacing: 0.08em;
  padding: 0.25rem 0.75rem; border-radius: 4px; cursor: pointer; transition: all 0.15s;
}
.bell-recusar:hover { border-color: var(--danger); color: var(--danger); }

.bell-empty { padding: 1.5rem 1rem; text-align: center; font-size: 0.8rem; color: var(--muted); }

/* ── MODAL WHATSAPP ── */
#wpp-modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 400;
  background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
  align-items: center; justify-content: center; padding: 1rem;
}
#wpp-modal-overlay.open { display: flex; }
.wpp-modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 1.5rem; width: 100%; max-width: 420px;
}
.wpp-modal-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;
}
.wpp-modal-title { font-family: 'Bebas Neue'; font-size: 1.2rem; letter-spacing: 0.06em; color: var(--text); }
.wpp-modal-close { background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; }
.wpp-msg-box {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 1rem; font-size: 0.85rem; color: var(--text);
  line-height: 1.7; margin-bottom: 1rem; white-space: pre-wrap;
}
.wpp-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wpp-copy-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  font-family: 'Bebas Neue'; font-size: 0.95rem; letter-spacing: 0.08em;
  padding: 0.65rem; border-radius: 6px; cursor: pointer; transition: all 0.15s; text-align: center;
}
.wpp-copy-btn:hover { border-color: var(--accent); color: var(--accent); }
.wpp-open-btn {
  background: #25d366; color: #fff; border: none;
  font-family: 'Bebas Neue'; font-size: 0.95rem; letter-spacing: 0.08em;
  padding: 0.65rem; border-radius: 6px; cursor: pointer; transition: opacity 0.15s;
  text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.wpp-open-btn:hover { opacity: 0.88; }
#notif-banner {
  display: none; background: rgba(138,143,152,0.08);
  border-bottom: 1px solid rgba(138,143,152,0.15);
  padding: 0.65rem 1.75rem; font-size: 0.82rem; color: var(--accent);
  gap: 8px; align-items: center; flex-wrap: wrap;
}
#notif-banner.show { display: flex; }
.notif-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; }

/* ── STATS ── */
.stats-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 1px; background: var(--border); border-bottom: 1px solid var(--border);
}
.stat-box { background: var(--surface); padding: 1rem 1.25rem; }
.s-label { font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.3rem; }
.s-val { font-family: 'Bebas Neue'; font-size: 1.75rem; letter-spacing: 0.02em; color: var(--text); line-height: 1; }
.s-val.accent { color: var(--accent); }
.s-val.small { font-size: 0.82rem; font-family: 'DM Sans'; font-weight: 400; padding-top: 3px; }

/* ── MAIN ── */
.main {
  display: grid; grid-template-columns: auto 1fr; flex: 1; min-height: calc(100vh - 220px); align-items: stretch;
}
@media (max-width: 900px) { .main { grid-template-columns: 1fr; } }

/* ── LEFT COLUMN ── */
.left-col { display: flex; flex-direction: column; border-right: 1px solid var(--border); }

/* ── CALENDÁRIO ── */
.calendar-panel { padding: 1.5rem 1.75rem; width: 520px; flex-shrink: 0; box-sizing: border-box; }
.cal-nav {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem;
}
.cal-nav-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.cal-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.cal-month { font-family: 'Bebas Neue'; font-size: 1.5rem; letter-spacing: 0.06em; }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 0.4rem 0; }

.cal-day {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start; padding: 8px 4px 4px; border-radius: 8px;
  cursor: pointer; position: relative; transition: background 0.12s;
  border: 1px solid transparent;
}
.cal-day:hover { background: var(--surface2); }
.cal-day.other-month .cal-day-num { color: rgba(255,255,255,0.12); }
.cal-day.today { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.07); }
.cal-day.today .cal-day-num { color: #fff; font-weight: 500; }
.cal-day.selected { background: rgba(138,143,152,0.18); border-color: var(--accent); }

.cal-day-num { font-size: 0.9rem; line-height: 1; margin-bottom: 4px; color: var(--text); }
.cal-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

/* ── SIDEBAR ── */
.sidebar { border-left: 1px solid var(--border); display: flex; flex-direction: column; align-self: stretch; }
.sidebar-header {
  padding: 1.25rem 1.25rem 0.75rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.sidebar-title { font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.add-btn {
  background: var(--accent); color: var(--bg); border: none;
  font-family: 'Bebas Neue'; font-size: 0.95rem; letter-spacing: 0.1em;
  padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; transition: opacity 0.15s;
}
.add-btn:hover { opacity: 0.85; }
.sidebar-date-label { padding: 0.75rem 1.25rem 0.5rem; font-size: 0.78rem; color: var(--muted); }
.sidebar-date-label strong { color: var(--text); font-weight: 500; }

/* ── SIDEBAR TABS ── */
.sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar-tab {
  flex: 1; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); padding: 0.7rem 0.5rem; cursor: pointer;
  background: none; border: none; border-bottom: 2px solid transparent;
  font-family: 'DM Sans'; transition: all 0.15s;
}
.sidebar-tab:hover { color: var(--text); }
.sidebar-tab.active { color: var(--text); border-bottom-color: var(--accent); }

.events-list { flex: 1; overflow-y: auto; padding: 0.5rem 1rem 1rem; }

.ev-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 0.85rem 1rem; margin-bottom: 8px;
  border-left: 3px solid transparent; transition: background 0.12s;
}
.ev-card:hover { background: var(--surface2); }
.ev-card.futebol { border-left-color: var(--futebol); }
.ev-card.carros  { border-left-color: var(--carros); }
.ev-card.motos   { border-left-color: var(--motos); }
.ev-card.ensaio  { border-left-color: var(--ensaio); }
.ev-card.outro   { border-left-color: var(--outro); }

.ev-nome { font-size: 0.9rem; font-weight: 500; margin-bottom: 4px; }
.ev-meta { font-size: 0.75rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.ev-bottom { display: flex; align-items: center; justify-content: space-between; }
.ev-valor { font-family: 'Bebas Neue'; font-size: 1.05rem; color: var(--accent); letter-spacing: 0.04em; }

.status-pill {
  font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 0.18rem 0.6rem; border-radius: 100px; cursor: pointer;
  border: none; font-family: 'DM Sans'; transition: opacity 0.15s;
}
.status-pill:hover { opacity: 0.75; }
.status-pill.pendente   { background: rgba(240,180,41,0.15); color: var(--motos); }
.status-pill.confirmado { background: rgba(74,158,255,0.15); color: var(--futebol); }
.status-pill.entregue   { background: rgba(78,203,141,0.15); color: var(--ensaio); }

.icon-btn { background: none; border: none; cursor: pointer; padding: 2px 5px; font-size: 0.8rem; transition: color 0.15s; }
.icon-btn.edit { color: rgba(255,255,255,0.2); }
.icon-btn.edit:hover { color: var(--accent); }
.icon-btn.dup  { color: rgba(255,255,255,0.2); }
.icon-btn.dup:hover  { color: #4ecb8d; }
.icon-btn.del  { color: rgba(255,255,255,0.2); }
.icon-btn.del:hover  { color: var(--danger); }

.empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
.empty-state .big { font-family: 'Bebas Neue'; font-size: 2.5rem; color: rgba(255,255,255,0.04); margin-bottom: 0.5rem; }
.empty-state p { font-size: 0.82rem; }

/* ── MODAL ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
  align-items: center; justify-content: center; padding: 1rem;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 1.75rem 1.5rem;
  width: 100%; max-width: 440px; max-height: 92vh; overflow-y: auto;
}
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.4rem; }
.modal-title { font-family: 'Bebas Neue'; font-size: 1.3rem; letter-spacing: 0.06em; }
.modal-close { background: none; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; transition: color 0.15s; }
.modal-close:hover { color: var(--text); }

.field { margin-bottom: 0.9rem; }
.field label { display: block; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.35rem; }
.field input, .field select {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-family: 'DM Sans'; font-size: 0.88rem; font-weight: 300;
  padding: 0.6rem 0.8rem; border-radius: 6px; outline: none;
  transition: border-color 0.15s; appearance: none;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.field input::placeholder { color: rgba(255,255,255,0.18); }
.field select option { background: #1e1e21; }
.date-time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

.tipo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.tipo-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
  font-family: 'DM Sans'; font-size: 0.78rem; font-weight: 400;
  padding: 0.5rem; border-radius: 6px; cursor: pointer; text-align: center; transition: all 0.15s;
}
.tipo-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
.tipo-btn.active[data-tipo="futebol"] { border-color: var(--futebol); color: var(--futebol); background: rgba(74,158,255,0.08); }
.tipo-btn.active[data-tipo="carros"]  { border-color: var(--carros);  color: var(--carros);  background: rgba(255,107,53,0.08); }
.tipo-btn.active[data-tipo="motos"]   { border-color: var(--motos);   color: var(--motos);   background: rgba(240,180,41,0.08); }
.tipo-btn.active[data-tipo="ensaio"]  { border-color: var(--ensaio);  color: var(--ensaio);  background: rgba(78,203,141,0.08); }
.tipo-btn.active[data-tipo="outro"]   { border-color: var(--outro);   color: var(--outro);   background: rgba(167,139,250,0.08); }

.modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 0.5rem; }
.save-btn {
  background: var(--accent); color: var(--bg); border: none;
  font-family: 'Bebas Neue'; font-size: 1rem; letter-spacing: 0.1em;
  padding: 0.75rem; border-radius: 6px; cursor: pointer; transition: opacity 0.15s;
}
.save-btn:hover { opacity: 0.85; }
.cancel-btn {
  background: transparent; color: var(--muted); border: 1px solid var(--border);
  font-family: 'DM Sans'; font-size: 0.85rem; padding: 0.75rem;
  border-radius: 6px; cursor: pointer; transition: all 0.15s;
}
.cancel-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

/* ── MOBILE — deve ficar no final para sobrescrever desktop ── */
@media (max-width: 600px) {
  header { padding: 0.75rem 1rem; gap: 0.5rem; }
  .header-left img { height: 52px; }
  .header-title { font-size: 1.2rem; }
  .header-date { display: none; }
  .header-right { gap: 0.5rem; }
  .logout-btn { font-size: 0.65rem; padding: 0.25rem 0.5rem; }

  .stats-row { grid-template-columns: 1fr 1fr; }
  .s-val { font-size: 1.4rem; }
  .s-val.small { font-size: 0.72rem; }
  .stat-box { padding: 0.75rem 1rem; }

  .main { grid-template-columns: 1fr !important; min-height: auto; }
  .left-col { border-right: none; border-bottom: 1px solid var(--border); width: 100%; }

  .calendar-panel { padding: 0.875rem 0.75rem; width: 100% !important; box-sizing: border-box; }
  .cal-nav { margin-bottom: 0.75rem; }
  .cal-month { font-size: 1.1rem; }
  .cal-nav-btn { width: 26px; height: 26px; font-size: 0.85rem; }
  .cal-grid { gap: 2px; width: 100%; }
  .cal-dow { font-size: 0.55rem; padding: 0.2rem 0; }
  .cal-day { padding: 3px 1px 2px; border-radius: 5px; }
  .cal-day-num { font-size: 0.72rem; margin-bottom: 2px; }
  .cal-dot { width: 3px; height: 3px; }

  .sidebar { border-left: none; min-height: 50vh; width: 100%; }

<script type="module">

const firebaseConfig = {
  apiKey: "AIzaSyAGuDCbOQfVpkj-jPJzglCgPNZE5P8lxRc",
  authDomain: "agenda-pabloframess-72769.firebaseapp.com",

  appId: "1:512997093150:web:ddd833425994c90129a30f"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);
const eventosCol = collection(db, 'eventos');
const solCol = collection(db, 'solicitacoes');


// ── SINO DE NOTIFICAÇÕES ──
let unsubSol = null;
let solicitacoes = [];

function iniciarNotifSol() {
  unsubSol = onSnapshot(solCol, (snapshot) => {
    solicitacoes = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    solicitacoes.sort((a,b) => (b.criadoEm?.seconds||0) - (a.criadoEm?.seconds||0));
    renderSino();
  });
}

window.toggleSino = function() {
  document.getElementById('bell-dropdown').classList.toggle('open');
};

document.addEventListener('click', function(e) {
  const wrap = document.getElementById('bell-wrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('bell-dropdown')?.classList.remove('open');
  }
});

function fmtDataSol(d) {
  if (!d) return '';
  const [y,m,dia] = d.split('-');
  return `${dia}/${m}/${y}`;
}

function renderSino() {
  const pendentes = solicitacoes.filter(s => s.status === 'pendente');
  const count = document.getElementById('bell-count');
  if (pendentes.length > 0) {
    count.textContent = pendentes.length > 9 ? '9+' : pendentes.length;
    count.classList.add('show');
  } else {
    count.classList.remove('show');
  }

  const todas = [...solicitacoes].sort((a,b) => {
    if (a.status === 'pendente' && b.status !== 'pendente') return -1;
    if (a.status !== 'pendente' && b.status === 'pendente') return 1;
    return (b.criadoEm?.seconds||0) - (a.criadoEm?.seconds||0);
  }).slice(0, 10);

  const list = document.getElementById('bell-list');
  if (todas.length === 0) {
    list.innerHTML = `<div class="bell-empty">Nenhuma solicitação ainda.</div>`;
    return;
  }

  list.innerHTML = todas.map(s => `
    <div class="bell-item">
      <div class="bell-item-nome">${s.nome}</div>
      <div class="bell-item-evento">${s.evento}</div>
      <div class="bell-item-meta">
        ${s.data ? `<span>📅 ${fmtDataSol(s.data)}${s.hora ? ' · '+s.hora : ''}</span>` : ''}
        ${s.telefone ? `<span>📞 ${s.telefone}</span>` : ''}
      </div>
      ${s.status === 'pendente' ? `
        <div class="bell-item-actions">
          <button class="bell-aceitar" onclick="bellAceitar('${s.id}')">✓ Aceitar</button>
          <button class="bell-recusar" onclick="bellRecusar('${s.id}')">✕ Recusar</button>
        </div>
      ` : `<span style="font-size:0.7rem;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;">${s.status === 'aceito' ? '✓ Aceito' : '✕ Recusado'}</span>`}
    </div>
  `).join('');
}

window.bellAceitar = async function(id) {
  const s = solicitacoes.find(x => x.id === id);
  if (!s) return;
  await addDoc(eventosCol, {
    nome: s.evento, data: s.data||'', hora: s.hora||'',
    local: s.local||'', tipo: s.tipo||'outro', valor: 0,
    status: 'confirmado',
    obs: `Cliente: ${s.nome} · ${s.telefone}${s.obs ? ' · '+s.obs : ''}`
  });
  await updateDoc(doc(db,'solicitacoes',id), { status: 'aceito' });

  // Envia e-mail para o cliente se tiver e-mail
  if (s.email) {
    try {
      await emailjs.send('service_ngchmnv', 'template_9rg0a9m', {
        client_name:  s.nome,
        client_email: s.email,
        event_name:   s.evento,
        event_date:   s.data ? s.data.split('-').reverse().join('/') : '—',
        event_time:   s.hora || '—',
        event_local:  s.local || '—'
      });
    } catch(e) {
      console.error('Erro ao enviar e-mail:', e);
    }
  }

  // Abre modal WhatsApp com mensagem pronta
  if (s.telefone) {
    abrirWpp(s);
  }
};

window.fecharWpp = function() {
  document.getElementById('wpp-modal-overlay').classList.remove('open');
};

window.copiarWpp = function() {
  const txt = document.getElementById('wpp-msg-text').textContent;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.getElementById('wpp-copy-btn');
    btn.textContent = '✓ Copiado!';
    setTimeout(() => btn.textContent = '📋 Copiar mensagem', 2000);
  });
};

function abrirWpp(s) {
  const tel = s.telefone.replace(/\D/g,'');
  const data = s.data ? s.data.split('-').reverse().join('/') : '—';
  const msg = `Olá ${s.nome}! 📷 Seu evento *${s.evento}* está confirmado para *${data}*${s.hora ? ' às *'+s.hora+'*' : ''}${s.local ? ' em *'+s.local+'*' : ''}. Qualquer dúvida estou à disposição!`;
  document.getElementById('wpp-msg-text').textContent = msg;
  document.getElementById('wpp-link').href = `https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`;
  document.getElementById('wpp-modal-overlay').classList.add('open');
}

window.bellRecusar = async function(id) {
  await updateDoc(doc(db,'solicitacoes',id), { status: 'recusado' });
};

let eventos = [];
let unsubEventos = null;
let calAno = new Date().getFullYear();
let calMes = new Date().getMonth();
let diaSelecionado = null;
let tabSidebar = 'proximos';
let tipoModal = 'futebol';
let modoEdicao = false;

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS  = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

// AUTH
onAuthStateChanged(auth, (user) => {
  document.getElementById('loading').style.display = 'none';
  if (user) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    iniciarApp();
    iniciarNotifSol();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    if (unsubEventos) { unsubEventos(); unsubEventos = null; }
    if (unsubSol) { unsubSol(); unsubSol = null; }
  }
});

window.fazerLogin = async function() {
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    await signInWithEmailAndPassword(auth, email, senha);
  } catch(e) {
    const msgs = {
      'auth/invalid-email':'E-mail inválido.',
      'auth/user-not-found':'Usuário não encontrado.',
      'auth/wrong-password':'Senha incorreta.',
      'auth/invalid-credential':'E-mail ou senha incorretos.',
      'auth/too-many-requests':'Muitas tentativas. Aguarde.'
    };
    err.textContent = msgs[e.code] || 'Erro ao entrar.';
  }
  btn.disabled = false; btn.textContent = 'ENTRAR';
};

document.getElementById('login-senha').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.fazerLogin();
});

window.fazerLogout = async function() { await signOut(auth); };

function iniciarApp() {
  const now = new Date();
  document.getElementById('header-date').innerHTML =
    now.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long', year:'numeric'})
      .replace(/^\w/, c => c.toUpperCase()) + '<br>Gaspar · SC';

  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }

  unsubEventos = onSnapshot(eventosCol, (snapshot) => {
    eventos = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    eventos.sort((a,b) => ((a.data||'9999')+(a.hora||'00:00')) < ((b.data||'9999')+(b.hora||'00:00')) ? -1 : 1);
    renderCalendario();
    renderSidebar();
    renderStats();
    verificarNotificacoes();
  });
}

// CALENDÁRIO
window.mudarMes = function(dir) {
  calMes += dir;
  if (calMes > 11) { calMes = 0; calAno++; }
  if (calMes < 0)  { calMes = 11; calAno--; }
  diaSelecionado = null;
  renderCalendario();
  renderSidebar();
};

function renderCalendario() {
  document.getElementById('cal-month-label').textContent = `${MESES[calMes]} ${calAno}`;
  const grid = document.getElementById('cal-grid');
  let html = DIAS.map(d => `<div class="cal-dow">${d}</div>`).join('');

  const primeiroDia = new Date(calAno, calMes, 1).getDay();
  const diasNoMes   = new Date(calAno, calMes + 1, 0).getDate();
  const diasMesAnt  = new Date(calAno, calMes, 0).getDate();
  const hoje = new Date(); hoje.setHours(0,0,0,0);

  for (let i = primeiroDia - 1; i >= 0; i--) {
    html += `<div class="cal-day other-month"><div class="cal-day-num">${diasMesAnt - i}</div></div>`;
  }

  for (let d = 1; d <= diasNoMes; d++) {
    const dataStr = `${calAno}-${String(calMes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = new Date(calAno, calMes, d).getTime() === hoje.getTime();
    const isSel   = diaSelecionado === dataStr;
    const evsDia  = eventos.filter(e => e.data === dataStr);
    const dots = evsDia.slice(0,4).map(e =>
      `<div class="cal-dot" style="background:var(--${e.tipo||'outro'})"></div>`
    ).join('');
    html += `<div class="cal-day${isToday?' today':''}${isSel?' selected':''}" onclick="selecionarDia('${dataStr}')">
      <div class="cal-day-num">${d}</div>
      ${dots ? `<div class="cal-dots">${dots}</div>` : ''}
    </div>`;
  }

  const totalCells = primeiroDia + diasNoMes;
  const restante = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let d = 1; d <= restante; d++) {
    html += `<div class="cal-day other-month"><div class="cal-day-num">${d}</div></div>`;
  }

  grid.innerHTML = html;
}

window.selecionarDia = function(dataStr) {
  diaSelecionado = diaSelecionado === dataStr ? null : dataStr;
  renderCalendario();
  renderSidebar();
};

// SIDEBAR
window.mudarTabSidebar = function(btn) {
  document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  tabSidebar = btn.dataset.tab;
  // Mostra filtro de mês só na aba entregues
  document.getElementById('filtro-mes-wrap').style.display = tabSidebar === 'entregues' ? 'block' : 'none';
  renderSidebar();
};

function renderSidebar() {
  const lista = document.getElementById('lista');
  const label = document.getElementById('sidebar-date-label');
  const title = document.getElementById('sidebar-title');
  let visíveis;

  if (diaSelecionado) {
    const [y,m,d] = diaSelecionado.split('-');
    label.innerHTML = `Eventos de <strong>${d}/${m}/${y}</strong>`;
    visíveis = eventos.filter(e => e.data === diaSelecionado);
  } else {
    label.innerHTML = '';
    visíveis = [...eventos];
  }

  // Filtra por aba
  if (tabSidebar === 'proximos') {
    visíveis = visíveis.filter(e => e.status !== 'entregue');
    title.textContent = diaSelecionado ? 'Eventos do dia' : 'Próximos eventos';
  } else {
    visíveis = visíveis.filter(e => e.status === 'entregue');
    title.textContent = 'Eventos entregues';

    // Popula o select de meses com os meses disponíveis
    const mesesDisp = [...new Set(visíveis.map(e => e.data ? e.data.substring(0,7) : null).filter(Boolean))].sort().reverse();
    const sel = document.getElementById('filtro-mes');
    const valAtual = sel.value;
    sel.innerHTML = '<option value="">Todos os meses</option>' +
      mesesDisp.map(m => {
        const [y, mo] = m.split('-');
        const nome = new Date(y, mo-1).toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
        return `<option value="${m}" ${valAtual === m ? 'selected' : ''}>${nome.charAt(0).toUpperCase()+nome.slice(1)}</option>`;
      }).join('');

    // Aplica filtro de mês
    const mesSel = document.getElementById('filtro-mes').value;
    if (mesSel) visíveis = visíveis.filter(e => e.data && e.data.startsWith(mesSel));
  }

  if (visíveis.length === 0) {
    const msg = tabSidebar === 'proximos'
      ? (diaSelecionado ? 'Nenhum evento neste dia.' : 'Nenhum evento próximo.')
      : 'Nenhum evento entregue ainda.';
    lista.innerHTML = `<div class="empty-state"><div class="big">VAZIO</div><p>${msg}</p></div>`;
    return;
  }

  lista.innerHTML = visíveis.map(e => {
    const val = e.valor ? 'R$ ' + Number(e.valor).toLocaleString('pt-BR',{minimumFractionDigits:0}) : '—';
    return `
      <div class="ev-card ${e.tipo||'outro'}">
        <div class="ev-nome">${e.nome}</div>
        <div class="ev-meta">
          ${e.data ? `<span>${e.data.split('-').reverse().join('/')}${e.hora ? ' · '+e.hora : ''}</span>` : ''}
          ${e.local ? `<span>${e.local}</span>` : ''}
          ${e.obs   ? `<span>${e.obs}</span>` : ''}
        </div>
        <div class="ev-bottom">
          <span class="ev-valor">${val}</span>
          <div style="display:flex;align-items:center;gap:6px;">
            <button class="status-pill ${e.status}" onclick="cicloStatus('${e.id}')">${e.status}</button>
            <button class="icon-btn dup"  onclick="duplicarEvento('${e.id}')" title="Duplicar">⧉</button>
            <button class="icon-btn edit" onclick="abrirModalEdicao('${e.id}')" title="Editar">✎</button>
            <button class="icon-btn del"  onclick="remover('${e.id}')" title="Remover">✕</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

// STATS
function renderStats() {
  document.getElementById('st-total').textContent = eventos.length;
  document.getElementById('st-conf').textContent  = eventos.filter(e => e.status === 'confirmado').length;
  const aReceber = eventos.filter(e => e.status !== 'entregue').reduce((s,e) => s+Number(e.valor||0), 0);
  const recebido = eventos.filter(e => e.status === 'entregue').reduce((s,e) => s+Number(e.valor||0), 0);
  document.getElementById('st-receber').textContent  = 'R$ '+aReceber.toLocaleString('pt-BR',{minimumFractionDigits:0});
  document.getElementById('st-recebido').textContent = 'R$ '+recebido.toLocaleString('pt-BR',{minimumFractionDigits:0});

  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const prox = eventos.find(e => {
    if (!e.data) return false;
    const ev = new Date(e.data+'T00:00:00');
    ev.setMinutes(ev.getMinutes()+ev.getTimezoneOffset());
    return ev >= hoje;
  });
  document.getElementById('st-proximo').textContent = prox
    ? prox.nome + (prox.hora ? ' · '+prox.hora : '')
    : '—';
}

// NOTIFICAÇÕES
function verificarNotificacoes() {
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const alertas = [];
  eventos.forEach(e => {
    if (!e.data || e.status === 'entregue') return;
    const ev = new Date(e.data+'T00:00:00');
    const diff = Math.round((ev - hoje) / 86400000);
    if (diff === 0) alertas.push(`📍 <strong>${e.nome}</strong> é hoje${e.hora?' às '+e.hora:''}`);
    else if (diff === 1) alertas.push(`⏰ <strong>${e.nome}</strong> é amanhã${e.hora?' às '+e.hora:''}`);
    else if (diff === 2) alertas.push(`📅 <strong>${e.nome}</strong> em 2 dias`);
  });
  const banner = document.getElementById('notif-banner');
  if (alertas.length > 0) {
    document.getElementById('notif-text').innerHTML = alertas.join(' &nbsp;·&nbsp; ');
    banner.classList.add('show');
    if ('Notification' in window && Notification.permission === 'granted') {
      alertas.forEach(a => new Notification('Agenda Fotógrafo', { body: a.replace(/<[^>]+>/g,'') }));
    }
  } else {
    banner.classList.remove('show');
  }
}

// MODAL
window.abrirModalNovo = function() {
  modoEdicao = false;
  document.getElementById('modal-title').textContent = 'Novo Evento';
  document.getElementById('edit-id').value    = '';
  document.getElementById('edit-nome').value  = '';
  document.getElementById('edit-data').value  = diaSelecionado || '';
  document.getElementById('edit-hora').value  = '';
  document.getElementById('edit-local').value = '';
  document.getElementById('edit-valor').value = '';
  document.getElementById('edit-obs').value   = '';
  document.getElementById('edit-status').value = 'pendente';
  tipoModal = 'futebol';
  document.querySelectorAll('#tipo-grid .tipo-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tipo === 'futebol')
  );
  document.getElementById('modal-overlay').classList.add('open');
};

window.abrirModalEdicao = function(id) {
  const e = eventos.find(x => x.id === id);
  if (!e) return;
  modoEdicao = true;
  document.getElementById('modal-title').textContent = 'Editar Evento';
  document.getElementById('edit-id').value    = id;
  document.getElementById('edit-nome').value  = e.nome  || '';
  document.getElementById('edit-data').value  = e.data  || '';
  document.getElementById('edit-hora').value  = e.hora  || '';
  document.getElementById('edit-local').value = e.local || '';
  document.getElementById('edit-valor').value = e.valor || '';
  document.getElementById('edit-obs').value   = e.obs   || '';
  document.getElementById('edit-status').value = e.status || 'pendente';
  tipoModal = e.tipo || 'futebol';
  document.querySelectorAll('#tipo-grid .tipo-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tipo === tipoModal)
  );
  document.getElementById('modal-overlay').classList.add('open');
};

window.fecharModal = function() {
  document.getElementById('modal-overlay').classList.remove('open');
};

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) fecharModal();
});

window.selTipo = function(btn) {
  document.querySelectorAll('#tipo-grid .tipo-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  tipoModal = btn.dataset.tipo;
};

window.salvar = async function() {
  const nome = document.getElementById('edit-nome').value.trim();
  if (!nome) { document.getElementById('edit-nome').focus(); return; }
  const valorRaw = document.getElementById('edit-valor').value.replace(/[^0-9,.]/g,'').replace(',','.');
  const dados = {
    nome,
    data:   document.getElementById('edit-data').value,
    hora:   document.getElementById('edit-hora').value,
    local:  document.getElementById('edit-local').value.trim(),
    tipo:   tipoModal,
    valor:  parseFloat(valorRaw) || 0,
    status: document.getElementById('edit-status').value,
    obs:    document.getElementById('edit-obs').value.trim()
  };
  if (modoEdicao) {
    await updateDoc(doc(db,'eventos', document.getElementById('edit-id').value), dados);
  } else {
    await addDoc(eventosCol, dados);
    if (dados.data) {
      const [y,m] = dados.data.split('-');
      calAno = parseInt(y); calMes = parseInt(m)-1;
      diaSelecionado = dados.data;
    }
  }
  fecharModal();
};

window.cicloStatus = async function(id) {
  const e = eventos.find(x => x.id === id);
  if (!e) return;
  const ciclo = ['pendente','confirmado','entregue'];
  await updateDoc(doc(db,'eventos',id), {
    status: ciclo[(ciclo.indexOf(e.status)+1) % ciclo.length]
  });
};

window.duplicarEvento = async function(id) {
  const e = eventos.find(x => x.id === id);
  if (!e) return;
  // Abre modal de novo evento com os dados preenchidos mas sem data/hora
  modoEdicao = false;
  document.getElementById('modal-title').textContent = 'Duplicar Evento';
  document.getElementById('edit-id').value    = '';
  document.getElementById('edit-nome').value  = e.nome;
  document.getElementById('edit-data').value  = '';
  document.getElementById('edit-hora').value  = e.hora || '';
  document.getElementById('edit-local').value = e.local || '';
  document.getElementById('edit-valor').value = e.valor || '';
  document.getElementById('edit-obs').value   = e.obs || '';
  document.getElementById('edit-status').value = 'pendente';
  tipoModal = e.tipo || 'futebol';
  document.querySelectorAll('#tipo-grid .tipo-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tipo === tipoModal)
  );
  document.getElementById('modal-overlay').classList.add('open');
};

window.remover = async function(id) {
  if (!confirm('Remover este evento?')) return;
  await deleteDoc(doc(db,'eventos',id));
};
</script>
