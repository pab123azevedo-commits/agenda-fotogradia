<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin — Agenda dos Fotógrafos</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080809; --surface: #141416; --surface2: #1a1a1d;
  --border: rgba(255,255,255,0.08); --text: #f0ede8;
  --muted: rgba(255,255,255,0.35); --accent: #8a8f98;
  --success: #4ecb8d; --danger: #ff5555;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; min-height: 100vh; background-image: radial-gradient(ellipse at 50% 0%, rgba(138,143,152,0.1) 0%, transparent 55%); }

#loading { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:999; font-family:'Bebas Neue'; font-size:1.5rem; letter-spacing:0.1em; color:rgba(255,255,255,0.25); }

#login-screen { display:none; min-height:100vh; align-items:center; justify-content:center; padding:1rem; }
.login-box { background:linear-gradient(160deg,#1c1c1f 0%,#111113 100%); border:0.5px solid rgba(255,255,255,0.1); border-radius:20px; padding:2.25rem 2rem; width:100%; max-width:360px; box-shadow:0 32px 80px rgba(0,0,0,0.6); }
.login-title { font-family:'Bebas Neue'; font-size:1.5rem; letter-spacing:0.06em; margin-bottom:0.25rem; }
.login-sub { font-size:0.65rem; color:rgba(255,255,255,0.25); letter-spacing:0.14em; text-transform:uppercase; margin-bottom:1.5rem; }
.field { margin-bottom:0.875rem; }
.field label { display:block; font-size:0.62rem; letter-spacing:0.12em; text-transform:uppercase; color:rgba(255,255,255,0.3); margin-bottom:0.45rem; }
.field input { width:100%; background:rgba(255,255,255,0.04); border:0.5px solid rgba(255,255,255,0.1); color:var(--text); font-family:'DM Sans'; font-size:0.9rem; padding:0.8rem 1rem; border-radius:10px; outline:none; transition:border-color 0.2s; }
.field input:focus { border-color:rgba(138,143,152,0.5); }
.field input::placeholder { color:rgba(255,255,255,0.15); }
.btn-login { width:100%; background:linear-gradient(135deg,#a0a5ae,#8a8f98,#6e7380); color:#080809; border:none; font-family:'Bebas Neue'; font-size:1.05rem; letter-spacing:0.15em; padding:0.9rem; border-radius:12px; cursor:pointer; margin-top:0.5rem; transition:opacity 0.2s; }
.btn-login:hover { opacity:0.9; }
#login-error { color:var(--danger); font-size:0.78rem; margin-top:0.75rem; min-height:1.2em; text-align:center; }

#app { display:none; }

header { padding:1rem 1.5rem; background:rgba(8,8,9,0.9); backdrop-filter:blur(20px); border-bottom:0.5px solid var(--border); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
.header-left { display:flex; align-items:center; gap:0.75rem; }
.header-left img { height:36px; }
.header-title { font-family:'Bebas Neue'; font-size:1.2rem; letter-spacing:0.05em; }
.header-title span { color:var(--accent); }
.admin-badge { background:rgba(240,180,41,0.12); border:0.5px solid rgba(240,180,41,0.25); border-radius:20px; padding:3px 12px; font-size:0.6rem; letter-spacing:0.12em; text-transform:uppercase; color:#f0b429; }
.btn-logout { background:transparent; border:0.5px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.3); font-family:'DM Sans'; font-size:0.65rem; letter-spacing:0.1em; text-transform:uppercase; padding:0.3rem 0.7rem; border-radius:20px; cursor:pointer; transition:all 0.15s; }
.btn-logout:hover { border-color:var(--danger); color:var(--danger); }

.content { padding:1.5rem; max-width:900px; margin:0 auto; }

.search-box {
  width:100%; background:var(--surface2); border:0.5px solid var(--border); color:var(--text);
  font-family:'DM Sans'; font-size:0.88rem; padding:0.75rem 1rem; border-radius:12px; outline:none;
  margin-bottom:1.25rem; transition:border-color 0.2s;
}
.search-box:focus { border-color:rgba(138,143,152,0.5); }
.search-box::placeholder { color:rgba(255,255,255,0.2); }

.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:1.5rem; }
.stat { background:linear-gradient(135deg,rgba(255,255,255,0.04),rgba(255,255,255,0.02)); border:0.5px solid var(--border); border-radius:14px; padding:1rem 1.25rem; }
.stat-label { font-size:0.58rem; letter-spacing:0.14em; text-transform:uppercase; color:rgba(255,255,255,0.25); margin-bottom:0.35rem; }
.stat-val { font-family:'Bebas Neue'; font-size:2rem; line-height:1; }
.stat-val.pending { color:#f0b429; }
.stat-val.approved { color:var(--success); }
.stat-val.expired { color:var(--danger); }

.section-title { font-size:0.65rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-bottom:1rem; }

.user-card { background:linear-gradient(135deg,rgba(255,255,255,0.035),rgba(255,255,255,0.015)); border:0.5px solid rgba(255,255,255,0.08); border-radius:14px; padding:1.25rem; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
.user-card.pendente { border-left:3px solid #f0b429; }
.user-card.aprovado { border-left:3px solid var(--success); opacity:0.6; }
.user-card.vencido { border-left:3px solid var(--danger); background:linear-gradient(135deg,rgba(255,85,85,0.06),rgba(255,85,85,0.02)); }

.user-info {}
.user-nome { font-size:0.95rem; font-weight:500; margin-bottom:3px; }
.user-email { font-size:0.75rem; color:var(--muted); }
.user-data { font-size:0.68rem; color:rgba(255,255,255,0.2); margin-top:4px; }

.user-actions { display:flex; gap:8px; flex-shrink:0; }
.btn-aprovar { background:rgba(78,203,141,0.12); color:var(--success); border:0.5px solid rgba(78,203,141,0.25); font-family:'Bebas Neue'; font-size:0.85rem; letter-spacing:0.08em; padding:0.45rem 1.25rem; border-radius:20px; cursor:pointer; transition:all 0.15s; }
.btn-aprovar:hover { background:rgba(78,203,141,0.22); }
.btn-bloquear { background:rgba(255,85,85,0.08); color:var(--danger); border:0.5px solid rgba(255,85,85,0.2); font-family:'Bebas Neue'; font-size:0.85rem; letter-spacing:0.08em; padding:0.45rem 1.25rem; border-radius:20px; cursor:pointer; transition:all 0.15s; }
.btn-bloquear:hover { background:rgba(255,85,85,0.15); }
.btn-wpp { background:rgba(37,211,102,0.1); color:#25D366; border:0.5px solid rgba(37,211,102,0.25); font-family:'Bebas Neue'; font-size:0.85rem; letter-spacing:0.08em; padding:0.45rem 1.25rem; border-radius:20px; cursor:pointer; transition:all 0.15s; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
.btn-wpp:hover { background:rgba(37,211,102,0.18); }

.status-pill { font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase; padding:0.2rem 0.7rem; border-radius:20px; }
.status-pill.pendente { background:rgba(240,180,41,0.12); color:#f0b429; }
.status-pill.aprovado { background:rgba(78,203,141,0.12); color:var(--success); }

.empty { text-align:center; padding:3rem 1rem; color:rgba(255,255,255,0.2); }
.empty big { font-family:'Bebas Neue'; font-size:2.5rem; color:rgba(255,255,255,0.05); display:block; margin-bottom:0.5rem; }

@media (max-width:600px) {
  .stats-row { grid-template-columns:1fr 1fr; }
  .user-card { flex-direction:column; align-items:flex-start; }
  .user-actions { width:100%; }
  .btn-aprovar, .btn-bloquear { flex:1; text-align:center; }
}
</style>
</head>
<body>

<div id="loading">Carregando...</div>

<div id="login-screen">
  <div class="login-box">
    <div class="login-title">Admin Panel</div>
    <div class="login-sub">Agenda dos Fotógrafos</div>
    <div class="field">
      <label>E-mail admin</label>
      <input type="email" id="email" placeholder="seu@email.com" />
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="••••••••" />
    </div>
    <button class="btn-login" onclick="fazerLogin()">ENTRAR</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="header-left">
      <img src="https://i.imgur.com/th7jUdY.png" alt="Logo" />
      <div>
        <div class="header-title">Agenda dos <span>Fotógrafos</span></div>
      </div>
      <div class="admin-badge">Admin</div>
    </div>
    <button class="btn-logout" onclick="fazerLogout()">Sair</button>
  </header>

  <div class="content">
    <input class="search-box" id="busca-usuario" placeholder="Buscar por nome, e-mail ou telefone..." oninput="renderUsuarios()" />

    <div class="stats-row">
      <div class="stat">
        <div class="stat-label">Total</div>
        <div class="stat-val" id="stat-total">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Pendentes</div>
        <div class="stat-val pending" id="stat-pendentes">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Vencidos</div>
        <div class="stat-val expired" id="stat-vencidos">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Ativos</div>
        <div class="stat-val approved" id="stat-aprovados">0</div>
      </div>
    </div>

    <div class="section-title">Pendentes de aprovação</div>
    <div id="lista-pendentes"></div>

    <div class="section-title" style="margin-top:2rem;">⚠ Plano vencido</div>
    <div id="lista-vencidos"></div>

    <div class="section-title" style="margin-top:2rem;">Ativos</div>
    <div id="lista-aprovados"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAGuDCbOQfVpkj-jPJzglCgPNZE5P8lxRc",
  authDomain: "agenda-pabloframess-72769.firebaseapp.com",
  projectId: "agenda-pabloframess-72769",
  storageBucket: "agenda-pabloframess-72769.firebasestorage.app",
  messagingSenderId: "512997093150",
  appId: "1:512997093150:web:ddd833425994c90129a30f"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

// Admin UIDs — só esses UIDs têm acesso ao painel
const ADMIN_UIDS = ['NiGMtI2e6ncWUNrPjxFSkDRD5kt2'];

onAuthStateChanged(auth, (user) => {
  document.getElementById('loading').style.display = 'none';
  if (user) {
    if (!ADMIN_UIDS.includes(user.uid)) {
      document.getElementById('loading').style.display = 'flex';
      document.getElementById('loading').textContent = 'Acesso negado.';
      signOut(auth);
      return;
    }
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    carregarUsuarios();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

function fmtData(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
}

let todosUsuarios = [];

function carregarUsuarios() {
  onSnapshot(collection(db, 'usuarios'), (snap) => {
    todosUsuarios = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
    renderUsuarios();
  });
}

window.renderUsuarios = function() {
  const termo = document.getElementById('busca-usuario').value.trim().toLowerCase();
  const users = termo
    ? todosUsuarios.filter(u =>
        (u.nome||'').toLowerCase().includes(termo) ||
        (u.email||'').toLowerCase().includes(termo) ||
        (u.telefone||'').replace(/\D/g,'').includes(termo.replace(/\D/g,''))
      )
    : todosUsuarios;

  {
    const pendentes = users.filter(u => !u.aprovado);
    const aprovadosTodos = users.filter(u => u.aprovado);
    const agora = new Date();
    const vencidos = aprovadosTodos.filter(u => u.planoVencimento && new Date(u.planoVencimento) < agora);
    const ativos = aprovadosTodos.filter(u => !(u.planoVencimento && new Date(u.planoVencimento) < agora));

    document.getElementById('stat-total').textContent = users.length;
    document.getElementById('stat-pendentes').textContent = pendentes.length;
    document.getElementById('stat-vencidos').textContent = vencidos.length;
    document.getElementById('stat-aprovados').textContent = ativos.length;

    // Renderiza pendentes
    const elPend = document.getElementById('lista-pendentes');
    if (pendentes.length === 0) {
      elPend.innerHTML = '<div class="empty"><big>✓</big>Nenhum pendente</div>';
    } else {
      elPend.innerHTML = pendentes.map(u => `
        <div class="user-card pendente">
          <div class="user-info">
            <div class="user-nome">${u.nome || '—'}</div>
            <div class="user-email">${u.email || '—'}</div>
            ${u.telefone ? `<div class="user-data">📱 ${u.telefone}</div>` : ''}
            <div class="user-data">Cadastrado em ${fmtData(u.criadoEm)}</div>
          </div>
          <div class="user-actions">
            ${u.telefone ? `<a class="btn-wpp" href="https://wa.me/55${u.telefone.replace(/\D/g,'')}?text=${encodeURIComponent('Olá '+u.nome+'! Vi seu cadastro na Agenda dos Fotógrafos. Para liberar seu acesso, assine o plano mensal pelo link: https://www.mercadopago.com.br/subscriptions/checkout?preapproval_plan_id=3907e309aeaf4f6c9ce98ab1672f8ba3&external_reference='+u.uid)}" target="_blank">💬 Enviar link MP</a>` : ''}
            <button class="btn-aprovar" onclick="aprovar('${u.uid}')">✓ Aprovar manual</button>
            <button class="btn-bloquear" onclick="bloquear('${u.uid}')">✕ Recusar</button>
          </div>
        </div>
      `).join('');
    }

    // Renderiza vencidos (destaque separado — é quem provavelmente devia estar pagando e não está)
    const elVenc = document.getElementById('lista-vencidos');
    if (vencidos.length === 0) {
      elVenc.innerHTML = '<div class="empty"><big>✓</big>Nenhum vencido</div>';
    } else {
      elVenc.innerHTML = vencidos.map(u => {
        const venc = new Date(u.planoVencimento);
        const diasVencido = Math.floor((agora - venc) / 86400000);
        return `
        <div class="user-card vencido">
          <div class="user-info">
            <div class="user-nome">${u.nome || '—'} <span class="status-pill" style="background:rgba(255,85,85,0.12);color:var(--danger);">VENCIDO HÁ ${diasVencido} DIA${diasVencido===1?'':'S'}</span></div>
            <div class="user-email">${u.email || '—'}</div>
            ${u.telefone ? `<div class="user-data">📱 ${u.telefone}</div>` : ''}
            <div class="user-data" style="color:var(--danger);">Venceu em ${venc.toLocaleDateString('pt-BR')}${u.ultimoPagamento ? ` · Último pagamento: ${fmtData(u.ultimoPagamento)}` : ''}</div>
          </div>
          <div class="user-actions">
            ${u.telefone ? `<a class="btn-wpp" href="https://wa.me/55${u.telefone.replace(/\D/g,'')}?text=${encodeURIComponent('Olá '+u.nome+'! Notei que sua assinatura da Agenda dos Fotógrafos venceu. Pra continuar usando sem interrupção, renova por aqui: https://www.mercadopago.com.br/subscriptions/checkout?preapproval_plan_id=3907e309aeaf4f6c9ce98ab1672f8ba3&external_reference='+u.uid)}" target="_blank">💬 Cobrar renovação</a>` : ''}
            <button class="btn-bloquear" onclick="bloquear('${u.uid}')">Bloquear</button>
          </div>
        </div>`;
      }).join('');
    }

    // Renderiza ativos (aprovados sem vencimento passado)
    const elAprov = document.getElementById('lista-aprovados');
    if (ativos.length === 0) {
      elAprov.innerHTML = '<div class="empty"><big>0</big>Nenhum ativo ainda</div>';
    } else {
      elAprov.innerHTML = ativos.map(u => {
        const venc = u.planoVencimento ? new Date(u.planoVencimento) : null;
        const vencStr = venc ? venc.toLocaleDateString('pt-BR') : '—';
        return `
        <div class="user-card aprovado">
          <div class="user-info">
            <div class="user-nome">${u.nome || '—'} <span class="status-pill aprovado">✓ Ativo</span></div>
            <div class="user-email">${u.email || '—'}</div>
            ${u.telefone ? `<div class="user-data">📱 ${u.telefone}</div>` : ''}
            <div class="user-data">Cadastrado em ${fmtData(u.criadoEm)}</div>
            <div class="user-data" style="color:rgba(255,255,255,0.2);">
              ${u.planoAtivo ? `✓ Plano ativo · vence ${vencStr}` : '— Sem plano ativo'}
              ${u.ultimoPagamento ? ` · Último pagamento: ${fmtData(u.ultimoPagamento)}` : ''}
            </div>
          </div>
          <div class="user-actions">
            ${u.telefone ? `<a class="btn-wpp" href="https://wa.me/55${u.telefone.replace(/\D/g,'')}?text=${encodeURIComponent('Olá '+u.nome+'! Tudo bem com sua Agenda dos Fotógrafos?')}" target="_blank">💬 WhatsApp</a>` : ''}
            <button class="btn-bloquear" onclick="bloquear('${u.uid}')">Bloquear</button>
          </div>
        </div>`
      }).join('');
    }
  }
};

window.aprovar = async function(uid) {
  await updateDoc(doc(db, 'usuarios', uid), { aprovado: true });
};

window.bloquear = async function(uid) {
  if (!confirm('Bloquear este fotógrafo?')) return;
  await updateDoc(doc(db, 'usuarios', uid), { aprovado: false });
};

window.fazerLogin = async function() {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try {
    await signInWithEmailAndPassword(auth, email, senha);
  } catch(e) {
    err.textContent = 'E-mail ou senha incorretos.';
  }
};

window.fazerLogout = async function() {
  await signOut(auth);
};

document.getElementById('senha').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.fazerLogin();
});
</script>
</body>
</html>
