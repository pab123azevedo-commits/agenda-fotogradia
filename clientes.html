<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clientes — Agenda dos Fotógrafos</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/th7jUdY.png" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e0f;
  --surface: #161618;
  --surface2: #1e1e21;
  --border: rgba(255,255,255,0.07);
  --text: #f0ede8;
  --muted: #7a7870;
  --accent: #8a8f98;
  --danger: #ff5555;
  --futebol: #4a9eff;
  --carros: #ff6b35;
  --motos: #f0b429;
  --ensaio: #4ecb8d;
  --outro: #a78bfa;
  --banlek: #22d3ee;
  --green: #4ecb8d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: hidden; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

header {
  display: flex; align-items: center; gap: 12px;
  padding: 1.1rem 1.5rem; border-bottom: 1px solid var(--border);
}
header img { width: 34px; height: 34px; border-radius: 8px; }
.header-title { font-family: 'Bebas Neue'; font-size: 1.05rem; letter-spacing: 0.04em; line-height: 1.05; }
.header-title span { color: var(--accent); }
.back-link {
  margin-left: auto; display: flex; align-items: center; gap: 6px;
  color: var(--muted); text-decoration: none; font-size: 0.82rem; transition: color 0.2s;
}
.back-link:hover { color: var(--text); }

.wrap { max-width: 820px; margin: 0 auto; padding: 1.5rem; }

.top-row { display: flex; gap: 10px; margin-bottom: 1.3rem; }
.search-box {
  flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px;
  padding: 0.7rem 1rem; color: var(--text); font-family: 'DM Sans'; font-size: 0.88rem; outline: none;
}
.search-box::placeholder { color: var(--muted); }
.btn-novo {
  background: linear-gradient(135deg, #4a9eff 0%, #2f7fe0 100%);
  color: #fff; border: none; border-radius: 12px; padding: 0.7rem 1.2rem;
  font-family: 'DM Sans'; font-size: 0.85rem; font-weight: 500; cursor: pointer;
  white-space: nowrap; transition: opacity 0.2s;
}
.btn-novo:hover { opacity: 0.9; }

.cliente-card {
  background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px;
  padding: 1.2rem 1.4rem; margin-bottom: 10px; cursor: pointer; transition: border-color 0.15s;
}
.cliente-card:hover { border-color: rgba(255,255,255,0.16); }
.cliente-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cliente-nome { font-size: 1rem; font-weight: 500; }
.cliente-contato { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
.cliente-stats { display: flex; gap: 14px; align-items: center; flex-shrink: 0; }
.cliente-stat { text-align: right; }
.cliente-stat .num { font-family: 'Bebas Neue'; font-size: 1.1rem; letter-spacing: 0.02em; }
.cliente-stat .lbl { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.cliente-anotacoes-preview { font-size: 0.76rem; color: var(--muted); margin-top: 8px; font-style: italic; }

.cliente-detalhe {
  margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);
  display: none;
}
.cliente-detalhe.open { display: block; }
.field { margin-bottom: 0.8rem; }
.field label { display: block; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.35rem; }
.field input, .field textarea {
  width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: 0.55rem 0.7rem; color: var(--text); font-family: 'DM Sans'; font-size: 0.85rem; outline: none;
}
.field textarea { resize: vertical; min-height: 60px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.detalhe-botoes { display: flex; gap: 8px; margin-top: 0.4rem; }
.btn-salvar {
  background: var(--green); color: #0e0e0f; border: none; border-radius: 8px;
  padding: 0.5rem 1rem; font-family: 'DM Sans'; font-size: 0.8rem; font-weight: 600; cursor: pointer;
}
.btn-excluir {
  background: transparent; color: var(--danger); border: 1px solid rgba(255,85,85,0.3); border-radius: 8px;
  padding: 0.5rem 1rem; font-family: 'DM Sans'; font-size: 0.8rem; cursor: pointer;
}

.historico-title { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 1rem 0 0.5rem; }
.hist-item { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--border); font-size: 0.82rem; }
.hist-item:last-child { border-bottom: none; }
.hist-nome { font-weight: 500; }
.hist-meta { font-size: 0.72rem; color: var(--muted); }
.hist-valor { font-weight: 500; color: var(--accent); }
.hist-vazio { color: var(--muted); font-size: 0.82rem; padding: 0.5rem 0; }

.tipo-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }

#loading, .vazio-geral { display: flex; align-items: center; justify-content: center; height: 50vh; color: var(--muted); font-size: 0.85rem; flex-direction: column; gap: 10px; text-align: center; }
</style>
</head>
<body>

<div id="loading">Carregando…</div>

<div id="page" style="display:none;">
  <header>
    <img src="https://i.imgur.com/th7jUdY.png" alt="Logo" />
    <div class="header-title">Clientes<br><span>Agenda dos Fotógrafos</span></div>
    <a class="back-link" href="index.html">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Voltar
    </a>
  </header>

  <div class="wrap">
    <div class="top-row">
      <input class="search-box" id="busca" placeholder="Buscar por nome, telefone ou evento..." oninput="render()" />
      <button class="btn-novo" onclick="abrirNovo()">+ Novo cliente</button>
    </div>

    <div id="lista-clientes"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc }
  from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAGuDCbOQfVpkj-jPJzglCgPNZE5P8lxRc",
  authDomain: "agenda-pabloframess-72769.firebaseapp.com",
  projectId: "agenda-pabloframess-72769",
  storageBucket: "agenda-pabloframess-72769.firebasestorage.app",
  messagingSenderId: "512997093150",
  appId: "1:512997093150:web:ddd833425994c90129a30f"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

const TIPO_COR = { futebol: '#4a9eff', carros: '#ff6b35', motos: '#f0b429', ensaio: '#4ecb8d', outro: '#a78bfa', banlek: '#22d3ee' };

let clientes = [];
let eventos  = [];
let clientesCol = null;
let cardAberto = null; // id do cliente com detalhe expandido

function normTel(t) { return (t||'').replace(/\D/g,''); }

function fmtMoeda(v) {
  return 'R$ ' + Number(v||0).toLocaleString('pt-BR', { minimumFractionDigits: 0 });
}

// Retorna os eventos vinculados a um cliente: por telefone (preferencial) ou nome exato (fallback)
function eventosDoCliente(cliente) {
  const tel = normTel(cliente.telefone);
  if (tel) return eventos.filter(e => normTel(e.telefone) === tel && e.tipo !== 'banlek');
  return eventos.filter(e => (e.nome||'').trim().toLowerCase() === (cliente.nome||'').trim().toLowerCase() && e.tipo !== 'banlek');
}

// Monta a lista completa de clientes: agrupa os eventos existentes por telefone (fallback: nome),
// mescla com cadastros já feitos manualmente (nome/anotações editados prevalecem), e também
// inclui cadastros manuais que ainda não têm nenhum evento vinculado.
function calcularListaClientes() {
  const grupos = {}; // chave (telefone normalizado, ou "nome:xxx" se não tiver telefone) -> dados agregados
  eventos.filter(e => e.tipo !== 'banlek' && ((e.nome||'').trim() || normTel(e.telefone))).forEach(e => {
    const tel = normTel(e.telefone);
    const key = tel || ('nome:' + (e.nome||'').trim().toLowerCase());
    if (!grupos[key]) grupos[key] = { telefone: e.telefone||'', nome: e.nome||'', evs: [] };
    grupos[key].evs.push(e);
    if (!grupos[key].telefone && e.telefone) grupos[key].telefone = e.telefone;
  });

  const idsUsados = new Set();
  const lista = Object.entries(grupos).map(([key, g]) => {
    const telNorm = normTel(g.telefone);
    const cadastro = telNorm
      ? clientes.find(c => normTel(c.telefone) === telNorm)
      : clientes.find(c => (c.nome||'').trim().toLowerCase() === g.nome.trim().toLowerCase());
    if (cadastro) idsUsados.add(cadastro.id);
    return {
      id: cadastro ? cadastro.id : 'novo_' + key.replace(/[^a-zA-Z0-9]/g, '_'),
      nome: cadastro?.nome || g.nome || '(sem nome)',
      telefone: cadastro?.telefone || g.telefone,
      email: cadastro?.email || '',
      anotacoes: cadastro?.anotacoes || '',
      evs: g.evs
    };
  });

  // Cadastros manuais que ainda não têm nenhum evento vinculado
  clientes.forEach(c => {
    if (!idsUsados.has(c.id)) {
      lista.push({ id: c.id, nome: c.nome, telefone: c.telefone, email: c.email, anotacoes: c.anotacoes, evs: [] });
    }
  });

  return lista;
}

window.render = function() {
  const termo = document.getElementById('busca').value.trim().toLowerCase();
  const lista = document.getElementById('lista-clientes');

  let visiveis = calcularListaClientes().map(c => {
    const evs = c.evs.slice().sort((a,b) => (b.data||'').localeCompare(a.data||''));
    const total = evs.reduce((s,e) => s + (e.status === 'entregue' ? Number(e.valor||0) : 0), 0);
    return { ...c, evs, total, ultimo: evs[0]?.data || '' };
  });

  if (termo) {
    visiveis = visiveis.filter(c =>
      (c.nome||'').toLowerCase().includes(termo) ||
      normTel(c.telefone).includes(termo.replace(/\D/g,'')) ||
      c.evs.some(e => (e.nome||'').toLowerCase().includes(termo))
    );
  }

  visiveis.sort((a,b) => (b.ultimo||'').localeCompare(a.ultimo||''));

  if (!calcularListaClientes().length) {
    lista.innerHTML = `<div class="vazio-geral">
      <div>Nenhum cliente encontrado ainda.</div>
      <div style="font-size:0.78rem;">Eles aparecem automaticamente conforme você cria eventos com telefone/nome preenchidos, ou clique em "+ Novo cliente".</div>
    </div>`;
    return;
  }
  if (!visiveis.length) {
    lista.innerHTML = `<div class="vazio-geral">Nenhum resultado pra "${termo}".</div>`;
    return;
  }

  lista.innerHTML = visiveis.map(c => `
    <div class="cliente-card" onclick="toggleCard('${c.id}')">
      <div class="cliente-top">
        <div>
          <div class="cliente-nome">${c.nome || '—'} ${c.id.startsWith('novo_') ? '<span style="font-size:0.62rem;color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:2px 8px;font-weight:400;vertical-align:middle;">não cadastrado</span>' : ''}</div>
          <div class="cliente-contato">${c.telefone || 'sem telefone'}${c.email ? ' · '+c.email : ''}</div>
        </div>
        <div class="cliente-stats">
          <div class="cliente-stat"><div class="num">${c.evs.length}</div><div class="lbl">Eventos</div></div>
          <div class="cliente-stat"><div class="num">${fmtMoeda(c.total)}</div><div class="lbl">Total</div></div>
        </div>
      </div>
      ${c.anotacoes ? `<div class="cliente-anotacoes-preview">"${c.anotacoes.slice(0,120)}${c.anotacoes.length>120?'...':''}"</div>` : ''}

      <div class="cliente-detalhe ${cardAberto === c.id ? 'open' : ''}" onclick="event.stopPropagation()">
        <div class="field"><label>Nome</label><input type="text" id="cf-nome-${c.id}" value="${(c.nome||'').replace(/"/g,'&quot;')}" /></div>
        <div class="row2">
          <div class="field"><label>Telefone</label><input type="tel" id="cf-tel-${c.id}" value="${c.telefone||''}" /></div>
          <div class="field"><label>E-mail</label><input type="email" id="cf-email-${c.id}" value="${c.email||''}" /></div>
        </div>
        <div class="field"><label>Anotações</label><textarea id="cf-obs-${c.id}">${c.anotacoes||''}</textarea></div>
        <div class="detalhe-botoes">
          <button class="btn-salvar" onclick="salvarCliente('${c.id}')">${c.id.startsWith('novo_') ? 'Cadastrar' : 'Salvar'}</button>
          ${!c.id.startsWith('novo_') ? `<button class="btn-excluir" onclick="excluirCliente('${c.id}')">Excluir cliente</button>` : ''}
        </div>

        <div class="historico-title">Histórico de eventos</div>
        ${c.evs.length ? c.evs.map(e => `
          <div class="hist-item">
            <div>
              <div class="hist-nome"><span class="tipo-dot" style="background:${TIPO_COR[e.tipo]||'#888'}"></span>${e.nome||'—'}</div>
              <div class="hist-meta">${e.data ? e.data.split('-').reverse().join('/') : '—'} · ${e.status||'pendente'}</div>
            </div>
            <div class="hist-valor">${fmtMoeda(e.valor)}</div>
          </div>`).join('') : '<div class="hist-vazio">Nenhum evento registrado ainda.</div>'}
      </div>
    </div>
  `).join('');
};

window.toggleCard = function(id) {
  cardAberto = cardAberto === id ? null : id;
  render();
};

window.abrirNovo = async function() {
  const nome = prompt('Nome do cliente:');
  if (!nome || !nome.trim()) return;
  const docRef = await addDoc(clientesCol, { nome: nome.trim(), telefone: '', email: '', anotacoes: '' });
  cardAberto = docRef.id;
};

window.salvarCliente = async function(id) {
  const nome = document.getElementById(`cf-nome-${id}`).value.trim();
  if (!nome) { alert('Nome é obrigatório.'); return; }
  const dados = {
    nome,
    telefone: document.getElementById(`cf-tel-${id}`).value.trim(),
    email: document.getElementById(`cf-email-${id}`).value.trim(),
    anotacoes: document.getElementById(`cf-obs-${id}`).value.trim()
  };
  if (id.startsWith('novo_')) {
    // Cliente ainda não tinha cadastro próprio (só existia como agrupamento dos eventos) — cria agora
    const docRef = await addDoc(clientesCol, dados);
    cardAberto = docRef.id;
  } else {
    await updateDoc(doc(db, ...clientesCol.path.split('/'), id), dados);
  }
};

window.excluirCliente = async function(id) {
  if (id.startsWith('novo_')) { cardAberto = null; render(); return; } // nada cadastrado ainda, só fecha
  if (!confirm('Excluir esse cliente? O histórico de eventos continua salvo, só o cadastro/anotações somem.')) return;
  await deleteDoc(doc(db, ...clientesCol.path.split('/'), id));
  cardAberto = null;
};

onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.href = 'index.html'; return; }

  clientesCol = collection(db, 'usuarios', user.uid, 'clientes');
  const eventosCol = collection(db, 'usuarios', user.uid, 'eventos');

  let carregouClientes = false, carregouEventos = false;
  function tentarMostrar() {
    if (carregouClientes && carregouEventos) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('page').style.display = 'block';
      render();
    }
  }

  onSnapshot(clientesCol, (snap) => {
    clientes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    carregouClientes = true;
    tentarMostrar();
    if (document.getElementById('page').style.display === 'block') render();
  });

  onSnapshot(eventosCol, (snap) => {
    eventos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    carregouEventos = true;
    tentarMostrar();
    if (document.getElementById('page').style.display === 'block') render();
  });
});
</script>
</body>
</html>
