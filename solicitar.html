<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Solicitar Fotógrafo</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/th7jUdY.png" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080809;
  --surface: #141416;
  --surface2: #1a1a1d;
  --border: rgba(255,255,255,0.08);
  --text: #f0ede8;
  --muted: rgba(255,255,255,0.35);
  --accent: #8a8f98;
  --success: #4ecb8d;
  --danger: #ff5555;
}

* { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: none; }
*::-webkit-scrollbar { display: none; }

body {
  background: #080809;
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(138,143,152,0.12) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 100%, rgba(138,143,152,0.05) 0%, transparent 50%);
  background-attachment: fixed;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem 3rem;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(138,143,152,0.07) 0%, transparent 60%);
  pointer-events: none;
}

.page {
  width: 100%; max-width: 540px;
  position: relative; z-index: 1;
  animation: fadeUp 0.5s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* HEADER */
.page-header {
  display: flex; align-items: center; gap: 1rem;
  margin-bottom: 2rem; padding: 0 0.25rem;
}
.page-header img { height: 52px; }
.page-title {
  font-family: 'Bebas Neue'; font-size: 1.6rem;
  letter-spacing: 0.05em; line-height: 1.05; color: var(--text);
}
.page-title span { color: var(--accent); }
.page-subtitle {
  font-size: 0.72rem; color: var(--muted);
  letter-spacing: 0.06em; margin-top: 4px;
}

/* FORM CARD */
.form-card {
  background: linear-gradient(160deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.02) 100%);
  border: 0.5px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 1.75rem 1.5rem;
  box-shadow: 0 24px 60px rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
}

.form-section {
  font-size: 0.58rem; letter-spacing: 0.16em;
  text-transform: uppercase; color: rgba(255,255,255,0.25);
  margin-bottom: 1rem; margin-top: 1.5rem;
  padding-bottom: 0.5rem;
  border-bottom: 0.5px solid rgba(255,255,255,0.07);
}
.form-section:first-child { margin-top: 0; }

.field { margin-bottom: 0.875rem; }
.field label {
  display: block; font-size: 0.62rem; letter-spacing: 0.12em;
  text-transform: uppercase; color: rgba(255,255,255,0.3);
  margin-bottom: 0.45rem;
}
.field input, .field select, .field textarea {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 0.5px solid rgba(255,255,255,0.1);
  color: var(--text); font-family: 'DM Sans'; font-size: 0.88rem; font-weight: 300;
  padding: 0.75rem 0.9rem; border-radius: 10px; outline: none;
  transition: border-color 0.2s, background 0.2s; appearance: none; resize: none;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: rgba(138,143,152,0.5);
  background: rgba(255,255,255,0.06);
}
.field input::placeholder, .field textarea::placeholder { color: rgba(255,255,255,0.15); }
.field select option { background: #1a1a1d; }
.field textarea { min-height: 80px; }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 400px) { .row2 { grid-template-columns: 1fr; } }

.tipo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tipo-btn {
  background: rgba(255,255,255,0.03); border: 0.5px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.3); font-family: 'DM Sans'; font-size: 0.78rem; font-weight: 400;
  padding: 0.6rem 0.5rem; border-radius: 10px; cursor: pointer;
  text-align: center; transition: all 0.15s;
}
.tipo-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
.tipo-btn.active[data-tipo="futebol"] { border-color: #4a9eff; color: #4a9eff; background: rgba(74,158,255,0.08); }
.tipo-btn.active[data-tipo="carros"]  { border-color: #ff6b35; color: #ff6b35; background: rgba(255,107,53,0.08); }
.tipo-btn.active[data-tipo="motos"]   { border-color: #f0b429; color: #f0b429; background: rgba(240,180,41,0.08); }
.tipo-btn.active[data-tipo="ensaio"]  { border-color: #4ecb8d; color: #4ecb8d; background: rgba(78,203,141,0.08); }
.tipo-btn.active[data-tipo="outro"]   { border-color: #a78bfa; color: #a78bfa; background: rgba(167,139,250,0.08); }

.submit-btn {
  width: 100%;
  background: linear-gradient(135deg, #a0a5ae 0%, #8a8f98 50%, #6e7380 100%);
  color: #080809; border: none;
  font-family: 'Bebas Neue'; font-size: 1.05rem; letter-spacing: 0.15em;
  padding: 0.95rem; border-radius: 20px; cursor: pointer;
  margin-top: 1.5rem;
  transition: opacity 0.2s, transform 0.15s;
  box-shadow: 0 8px 24px rgba(138,143,152,0.25);
}
.submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
.submit-btn:active { transform: translateY(0); }
.submit-btn:disabled { opacity: 0.35; cursor: default; transform: none; }

/* SUCCESS */
#success { display: none; text-align: center; padding: 3rem 2rem; animation: fadeUp 0.4s ease both; }
.success-icon { font-size: 3rem; margin-bottom: 1rem; }
.success-title { font-family: 'Bebas Neue'; font-size: 2rem; letter-spacing: 0.06em; color: var(--success); margin-bottom: 0.5rem; }
.success-msg { font-size: 0.88rem; color: var(--muted); line-height: 1.7; }

#error-msg { color: var(--danger); font-size: 0.78rem; margin-top: 0.75rem; text-align: center; min-height: 1em; letter-spacing: 0.04em; }

.page-footer { text-align: center; margin-top: 1.5rem; font-size: 0.68rem; color: rgba(255,255,255,0.12); letter-spacing: 0.08em; }

</style>
</head>
<body>

<div class="page">
  <div class="page-header">
    <img src="https://i.imgur.com/th7jUdY.png" alt="Logo" />
    <div class="page-header-text">
      <div class="page-title">Solicitar<br><span>Fotógrafo</span></div>
      <div class="page-subtitle">Preencha os dados e entrarei em contato</div>
    </div>
  </div>

  <div class="form-card" id="form-card">
    <div id="success" style="display:none;">
      <div class="success-icon">✓</div>
      <div class="success-title">Solicitação Enviada!</div>
      <div class="success-msg">Recebi seu pedido e entrarei em<br>contato em breve para confirmar.</div>
    </div>

    <div id="form-content">
      <div class="form-section">Seus dados</div>

      <div class="field">
        <label>Nome completo *</label>
        <input type="text" id="nome" placeholder="Seu nome" />
      </div>
      <div class="row2">
        <div class="field">
          <label>WhatsApp *</label>
          <input type="tel" id="telefone" placeholder="(47) 99999-9999" />
        </div>
        <div class="field">
          <label>E-mail *</label>
          <input type="email" id="email" placeholder="seu@email.com" />
        </div>
      </div>

      <div class="form-section">Dados do evento</div>

      <div class="field">
        <label>Nome do evento *</label>
        <input type="text" id="evento" placeholder="Ex: Jogo do Chapecoense, Ensaio família..." />
      </div>

      <div class="row2">
        <div class="field">
          <label>Data *</label>
          <input type="date" id="data" />
        </div>
        <div class="field">
          <label>Horário</label>
          <input type="time" id="hora" />
        </div>
      </div>

      <div class="field">
        <label>Local</label>
        <input type="text" id="local" placeholder="Endereço, estádio, espaço..." />
      </div>

      <div class="field">
        <label>Tipo de evento</label>
        <div class="tipo-grid">
          <button class="tipo-btn" data-tipo="futebol" onclick="selTipo(this)">Futebol</button>
          <button class="tipo-btn" data-tipo="carros"  onclick="selTipo(this)">Carros</button>
          <button class="tipo-btn" data-tipo="motos"   onclick="selTipo(this)">Motos</button>
          <button class="tipo-btn" data-tipo="ensaio"  onclick="selTipo(this)">Ensaio</button>
          <button class="tipo-btn" data-tipo="outro"   onclick="selTipo(this)" style="grid-column:span 2">Outro</button>
        </div>
      </div>

      <div class="field">
        <label>Observações</label>
        <textarea id="obs" placeholder="Descreva mais detalhes sobre o evento, o que precisa ser fotografado, duração estimada..."></textarea>
      </div>

      <div id="error-msg"></div>
      <button class="submit-btn" id="submit-btn" onclick="enviar()">ENVIAR SOLICITAÇÃO</button>
    </div>
  </div>

  <div class="page-footer">Agenda dos Fotógrafos · Gaspar SC</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init('QT4JDG8v2KGJ6GEbe');</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAGuDCbOQfVpkj-jPJzglCgPNZE5P8lxRc",
  authDomain: "agenda-pabloframess-72769.firebaseapp.com",
  projectId: "agenda-pabloframess-72769",
  storageBucket: "agenda-pabloframess-72769.firebasestorage.app",
  messagingSenderId: "512997093150",
  appId: "1:512997093150:web:ddd833425994c90129a30f"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
// Pega o uid do fotógrafo da URL
const urlParams = new URLSearchParams(window.location.search);
const fotografoUid = urlParams.get('uid');

// Se tiver uid usa a coleção do fotógrafo, senão usa a antiga
const solicitacoesCol = fotografoUid
  ? collection(db, 'usuarios', fotografoUid, 'solicitacoes')
  : collection(db, 'solicitacoes');

let tipoSel = '';

window.selTipo = function(btn) {
  document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  tipoSel = btn.dataset.tipo;
};

window.enviar = async function() {
  const nome     = document.getElementById('nome').value.trim();
  const telefone = document.getElementById('telefone').value.trim();
  const evento   = document.getElementById('evento').value.trim();
  const data     = document.getElementById('data').value;
  const err      = document.getElementById('error-msg');
  const btn      = document.getElementById('submit-btn');

  err.textContent = '';

  if (!nome)     { err.textContent = 'Por favor informe seu nome.'; return; }
  if (!telefone) { err.textContent = 'Por favor informe seu WhatsApp.'; return; }
  if (!document.getElementById('email').value.trim()) { err.textContent = 'Por favor informe seu e-mail.'; return; }
  if (!evento)   { err.textContent = 'Por favor informe o nome do evento.'; return; }
  if (!data)     { err.textContent = 'Por favor informe a data do evento.'; return; }

  btn.disabled = true;
  btn.textContent = 'ENVIANDO…';

  try {
    await addDoc(solicitacoesCol, {
      nome,
      telefone,
      email:   document.getElementById('email').value.trim(),
      evento,
      data,
      hora:    document.getElementById('hora').value,
      local:   document.getElementById('local').value.trim(),
      tipo:    tipoSel || 'outro',
      obs:     document.getElementById('obs').value.trim(),
      status:  'pendente',
      criadoEm: serverTimestamp()
    });

    // Envia e-mail de notificação para o fotógrafo
    try {
      await emailjs.send('service_ngchmnv', 'template_q5wgv9h', {
        client_name:  nome,
        client_phone: telefone,
        client_email: document.getElementById('email').value.trim(),
        event_name:   evento,
        event_date:   data ? data.split('-').reverse().join('/') : '—',
        event_time:   document.getElementById('hora').value || '—',
        event_local:  document.getElementById('local').value.trim() || '—',
        event_type:   tipoSel || 'outro',
        event_obs:    document.getElementById('obs').value.trim() || '—'
      });
    } catch(emailErr) {
      console.error('Erro ao notificar fotógrafo:', emailErr);
    }

    // Envia push notification imediata pro fotógrafo (se ele tiver ativado notificações)
    if (fotografoUid) {
      try {
        await fetch('/api/notificar-solicitacao', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            uid: fotografoUid,
            nomeCliente: nome,
            evento,
            data,
            hora: document.getElementById('hora').value
          })
        });
      } catch (pushErr) {
        console.error('Erro ao enviar push:', pushErr);
      }
    }

    document.getElementById('form-content').style.display = 'none';
    document.getElementById('success').style.display = 'block';

  } catch(e) {
    err.textContent = 'Erro ao enviar. Tente novamente.';
    btn.disabled = false;
    btn.textContent = 'ENVIAR SOLICITAÇÃO';
  }
};
</script>
</body>
</html>
